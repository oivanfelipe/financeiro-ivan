<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Orçamento Ivan</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237C3AED'/%3E%3Cpolyline points='26,9 17,17.5 12,12.5 6,19' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='20,9 26,9 26,15' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    /* ── TOKENS ── */
    :root {
      --accent:      #7C3AED;
      --accent-soft: #F5F3FF;
      --bg:          #FFFFFF;
      --surface:     #F8FAFC;
      --surface2:    #F1F5F9;
      --border:      #EAECF0;
      --text-1:      #0D1117;
      --text-2:      #6B7280;
      --text-3:      #B0B7C3;
      --green:       #059669; --green-bg: #F0FDF4;
      --red:         #DC2626; --red-bg:   #FEF2F2;
      --amber:       #D97706; --amber-bg: #FFFBEB;
      --nav-h:       72px;
      --radius:      12px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:          #0C0A1A; --surface: #160F2A; --surface2: #1E1535;
        --border:      #2A1F45; --text-1: #F0EEFF; --text-2: #8B81A8; --text-3: #3D3055;
        --accent-soft: #2E1065; --green-bg: #052E16; --red-bg: #3B0A0A; --amber-bg: #3B1F00;
      }
    }
    :root[data-theme="dark"] {
      --bg:          #0C0A1A; --surface: #160F2A; --surface2: #1E1535;
      --border:      #2A1F45; --text-1: #F0EEFF; --text-2: #8B81A8; --text-3: #3D3055;
      --accent-soft: #2E1065; --green-bg: #052E16; --red-bg: #3B0A0A; --amber-bg: #3B1F00;
    }
    :root[data-theme="light"] {
      --bg: #FFFFFF; --surface: #F8FAFC; --surface2: #F1F5F9;
      --border: #EAECF0; --text-1: #0D1117; --text-2: #6B7280; --text-3: #B0B7C3;
      --accent-soft: #F5F3FF; --green-bg: #F0FDF4; --red-bg: #FEF2F2; --amber-bg: #FFFBEB;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text-1); font-size: 15px;
      min-height: 100vh; max-width: 480px; margin: 0 auto;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
    }
    input, select, textarea { font-size: 16px !important; font-family: inherit; }

    /* ── HEADER ── */
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px 10px; background: var(--bg);
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--border);
    }
    .app-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 17px; font-weight: 700; color: var(--text-1);
      text-decoration: none;
    }
    .app-title-icon {
      width: 32px; height: 32px; border-radius: 9px;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .app-title-icon svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .app-title-text em { font-style: normal; color: var(--accent); }
    .mes-nav { display: flex; align-items: center; gap: 2px; }
    .mes-nav-btn {
      background: none; border: none; color: var(--text-3); font-size: 22px;
      cursor: pointer; min-height: 44px; min-width: 36px;
      display: flex; align-items: center; justify-content: center;
    }
    .mes-nav-btn:hover { color: var(--text-2); }
    .mes-nav-label { font-size: 13px; font-weight: 600; color: var(--text-1); white-space: nowrap; }
    .btn-icon {
      background: none; border: none; color: var(--text-3); font-size: 18px;
      cursor: pointer; min-height: 44px; min-width: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
    }
    .btn-icon:hover { color: var(--text-2); background: var(--surface); }

    /* ── CONTENT ── */
    .content { padding: 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── HERO BLOCK ── */
    .hero {
      padding: 28px 0 24px; text-align: center;
    }
    .hero-eyebrow {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-3); margin-bottom: 6px;
    }
    .hero-number {
      font-size: 48px; font-weight: 800; letter-spacing: -0.02em; line-height: 1;
      color: var(--text-1); font-variant-numeric: tabular-nums;
    }
    .hero-number.green { color: var(--green); }
    .hero-number.red   { color: var(--red); }
    .hero-sub {
      font-size: 13px; color: var(--text-2); margin-top: 8px;
    }
    .hero-chips { display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .hero-chip {
      font-size: 12px; font-weight: 600; padding: 5px 12px;
      border-radius: 99px; background: var(--surface);
      color: var(--text-2); border: 1px solid var(--border);
    }
    .hero-chip.green { background: var(--green-bg); color: var(--green); border-color: transparent; }
    .hero-chip.red   { background: var(--red-bg);   color: var(--red);   border-color: transparent; }
    .hero-chip.amber { background: var(--amber-bg); color: var(--amber); border-color: transparent; }
    .hero-divider { height: 1px; background: var(--border); margin: 0 0 16px; }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: var(--bg); border-top: 1px solid var(--border);
      display: flex; z-index: 100;
      padding-bottom: max(env(safe-area-inset-bottom), 12px);
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 14px 0 10px; border: none; background: transparent;
      color: var(--text-3); gap: 5px; cursor: pointer;
      transition: color 0.15s; min-height: var(--nav-h); position: relative;
    }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: var(--text-1); }
    .nav-pip {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--accent); position: absolute; bottom: 6px;
      display: none;
    }
    .nav-item.active .nav-pip { display: block; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(200px);
      background: var(--surface2); border: 1px solid var(--border); color: var(--text-1);
      border-radius: 24px; padding: 10px 18px; font-size: 13px;
      display: flex; align-items: center; gap: 10px;
      transition: transform 0.3s ease; z-index: 200; white-space: nowrap;
      max-width: calc(100vw - 32px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error   { background: var(--red-bg);   border-color: var(--red);   color: var(--red); }
    .toast.success { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .btn-retry {
      background: var(--accent); border: none; border-radius: 14px;
      color: #fff; font-size: 11px; font-weight: 600; padding: 3px 10px; cursor: pointer;
    }

    /* ── LOADING ── */
    .loading { display: flex; align-items: center; gap: 10px; padding: 32px 0; color: var(--text-3); font-size: 13px; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; padding: 40px 0; color: var(--text-3); font-size: 13px; }
    .empty-state .icon { font-size: 32px; margin-bottom: 10px; }

    .sec-title {
      font-size: 11px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.08em; margin: 20px 0 10px;
    }
    .secao-divider {
      font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase;
      letter-spacing: 0.1em; padding: 10px 0 4px; display: flex; align-items: center; gap: 8px;
    }
    .secao-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .progress-bar { background: var(--surface2); border-radius: 99px; height: 6px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; background: var(--green); }
    .progress-fill.amber { background: var(--amber); }
    .progress-fill.red   { background: var(--red); }

    /* ── DASHBOARD KPI ── */
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .kpi-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
    }
    .kpi-card.highlight { border-color: var(--accent); background: var(--accent-soft); margin-bottom: 20px; }
    .kpi-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .kpi-value { font-size: 22px; font-weight: 700; color: var(--text-1); font-variant-numeric: tabular-nums; }
    .kpi-value.green { color: var(--green); }
    .kpi-value.red   { color: var(--red); }
    .kpi-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; }

    .pace-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 8px;
    }
    .pace-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .pace-name { font-size: 14px; font-weight: 500; color: var(--text-1); }
    .pace-badge { font-size: 12px; font-weight: 600; }
    .pace-badge.ok   { color: var(--green); }
    .pace-badge.warn { color: var(--amber); }
    .pace-badge.over { color: var(--red); }
    .sem-teto-badge  { color: var(--text-3); font-weight: 500; }
    .pace-amounts { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }

    .top-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .top-rank { font-size: 12px; color: var(--text-3); width: 16px; flex-shrink: 0; }
    .top-name { font-size: 13px; color: var(--text-2); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-bar-wrap { width: 80px; background: var(--surface2); border-radius: 4px; height: 6px; flex-shrink: 0; }
    .top-bar { height: 6px; border-radius: 4px; background: var(--accent); }
    .top-val { font-size: 13px; color: var(--text-2); white-space: nowrap; }

    .alert-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: var(--red-bg); border: 1px solid var(--red);
      border-radius: 10px; margin-bottom: 6px; font-size: 13px; opacity: 0.9;
    }
    .alert-item .name { color: var(--red); display: flex; align-items: center; gap: 6px; }
    .alert-item .val  { color: var(--red); font-weight: 600; }

    /* ── CONTAS ── */
    .contas-top-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .contas-top-title { font-size: 16px; font-weight: 700; color: var(--text-1); }
    .btn-nova {
      background: var(--accent); border: none; color: #fff; border-radius: 10px;
      padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 44px;
    }
    .contas-summary {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
    }
    .cs-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
    }
    .cs-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .cs-val { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-1); }
    .cs-val.red   { color: var(--red); }
    .cs-val.green { color: var(--green); }

    .conta-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 10px; position: relative;
    }
    .conta-card.overdue { border-color: var(--red); }
    .conta-card.today   { border-color: var(--amber); }
    .conta-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .conta-left { flex: 1; min-width: 0; padding-right: 40px; }
    .conta-name { font-size: 15px; font-weight: 600; color: var(--text-1); }
    .conta-meta { font-size: 12px; color: var(--text-3); margin-top: 3px; }
    .conta-right { text-align: right; flex-shrink: 0; }
    .conta-val  { font-size: 17px; font-weight: 700; color: var(--text-1); font-variant-numeric: tabular-nums; }
    .conta-paid { font-size: 11px; color: var(--green); margin-top: 2px; }
    .conta-rem  { font-size: 12px; color: var(--red);   margin-top: 2px; }
    .pag-diff { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin: 6px 0 4px; display: inline-block; }
    .pag-diff.over  { background: var(--red-bg);   color: var(--red); }
    .pag-diff.under { background: var(--green-bg); color: var(--green); }
    .pag-diff.exact { background: var(--green-bg); color: var(--green); }
    .btn-pay-edit {
      background: var(--bg); border: 1px solid var(--border); color: var(--text-2); border-radius: 12px;
      padding: 0 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .btn-pay-edit svg { width: 14px; height: 14px; stroke: currentColor; fill: none; flex-shrink: 0; }
    .btn-pay-edit:hover { border-color: var(--accent); color: var(--accent); }
    .pay-hist-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .pay-hist-info { display: flex; flex-direction: column; gap: 2px; }
    .pay-hist-val  { font-size: 14px; font-weight: 600; color: var(--text-1); }
    .pay-hist-meta { font-size: 11px; color: var(--text-3); }

    .badge {
      display: inline-flex; align-items: center; font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 99px; margin-top: 8px;
    }
    .badge-pago    { background: var(--green-bg); color: var(--green); }
    .badge-parcial { background: var(--accent-soft); color: var(--accent); }
    .badge-vencido { background: var(--red-bg);   color: var(--red); }
    .badge-hoje    { background: var(--amber-bg); color: var(--amber); }
    .badge-semana  { background: var(--amber-bg); color: var(--amber); }
    .badge-futuro  { background: var(--surface2); color: var(--text-3); }
    .badge-fatura  { background: var(--accent-soft); color: var(--accent); }
    .badge-auto    { background: var(--accent-soft); color: var(--accent); }
    .badge-manual  { background: var(--amber-bg); color: var(--amber); }

    /* ── RECORRÊNCIA ── */
    .rec-toggle { display: flex; gap: 7px; margin-bottom: 14px; }
    .rec-opt {
      flex: 1; padding: 10px 6px; background: var(--surface); border: 2px solid var(--border);
      border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.15s;
    }
    .rec-opt-icon { display: flex; justify-content: center; margin-bottom: 3px; }
    .rec-opt-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; }
    .rec-opt-label { font-size: 11px; font-weight: 600; color: var(--text-2); display: block; }
    .rec-opt-hint { font-size: 9px; color: var(--text-3); display: block; margin-top: 2px; }
    .rec-opt.sel-auto  { border-color: var(--accent); background: var(--accent-soft); }
    .rec-opt.sel-auto .rec-opt-label  { color: var(--accent); }
    .rec-opt.sel-manual { border-color: var(--amber); background: var(--amber-bg); }
    .rec-opt.sel-manual .rec-opt-label { color: var(--amber); }
    .rec-opt.sel-pontual { border-color: var(--accent); background: var(--accent-soft); }
    .rec-opt.sel-pontual .rec-opt-label { color: var(--accent); }

    /* ── PLANEJAMENTO ── */
    .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .plan-title  { font-size: 16px; font-weight: 700; color: var(--text-1); }
    .plan-total  { font-size: 13px; color: var(--red); font-weight: 600; }
    .plan-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px 14px; margin-bottom: 7px;
      display: flex; align-items: center; gap: 10px;
    }
    .cat-avatar {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff; line-height: 1;
      overflow: hidden;
    }
    .cat-avatar.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 14px; }
    .cat-avatar.has-svg svg {
      width: 56%; height: 56%; display: block; flex-shrink: 0;
      stroke: #fff; stroke-width: 2; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .cat-avatar.sm.has-svg svg { width: 58%; height: 58%; }
    .plan-emoji { font-size: 20px; flex-shrink: 0; }
    .plan-info  { flex: 1; min-width: 0; }
    .plan-name  { font-size: 14px; font-weight: 600; color: var(--text-1); }
    .plan-meta  { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .plan-right { text-align: right; flex-shrink: 0; }
    .plan-val   { font-size: 14px; font-weight: 700; color: var(--text-1); font-variant-numeric: tabular-nums; }
    .plan-day   { font-size: 11px; color: var(--text-3); margin-top: 2px; }

    .conta-prog { margin-top: 10px; }
    .conta-prog .progress-bar { height: 5px; }

    .menu-btn {
      position: absolute; top: 12px; right: 12px;
      background: none; border: none; color: var(--text-3); cursor: pointer;
      font-size: 18px; padding: 4px 6px; min-height: 32px; border-radius: 6px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .menu-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }
    .menu-btn:hover { color: var(--text-2); background: var(--surface2); }
    .menu-popup {
      position: absolute; top: 42px; right: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 4px; z-index: 20; min-width: 140px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: none;
    }
    .menu-popup.open { display: block; }
    .menu-item {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border-radius: 7px; cursor: pointer; font-size: 13px;
      border: none; background: none; color: var(--text-1); width: 100%; text-align: left;
    }
    .menu-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; flex-shrink: 0; }
    .menu-item:hover { background: var(--surface2); }
    .menu-item.danger { color: var(--red); }

    .btn-pay-full {
      width: 100%; background: var(--accent); border: none; color: #fff;
      border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 12px; min-height: 48px;
    }
    .btn-pay-full:hover { opacity: 0.9; }
    .btn-pay-full.paid-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--green); cursor: default; }

    /* ── FATURAS ── */
    .fatura-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px;
    }
    .fatura-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .fatura-card-name { font-size: 15px; font-weight: 600; color: var(--text-1); display: flex; align-items: center; gap: 8px; }
    .fatura-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .fatura-total { font-size: 20px; font-weight: 700; color: var(--text-1); font-variant-numeric: tabular-nums; }
    .fatura-sub { font-size: 12px; color: var(--text-3); margin-bottom: 10px; }
    .fatura-cat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-top: 1px solid var(--border); }
    .fatura-total-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0 0; margin-top: 8px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-2); }
    .fatura-cat-name { color: var(--text-2); }

function catIconSvg(cat) {
  const raw = (cat?.name || '').toLowerCase();
  // normalize accents
  const name = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  for (const [kw, svg] of CAT_ICON_MAP) {
    if (name.includes(kw)) return svg;
  }
  return null;
}

const CAT_COLOR_NAME = {
  'melina': '#EC4899',
  'mel':    '#EC4899',
};
function catAvatarBg(cat) {
  const key = (cat?.name || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  return CAT_COLOR_NAME[key] || catColor(cat?.id || cat?.name || '?');
}
function catAvatar(cat, size='') {
  const bg  = catAvatarBg(cat);
  const cls = size === 'sm' ? 'cat-avatar sm' : 'cat-avatar';
  const svg = catIconSvg(cat);
  if (svg) return `<div class="${cls} has-svg" style="background:${bg}">${svg}</div>`;
  if (cat?.emoji) return `<div class="${cls}" style="background:${bg}">${esc(cat.emoji)}</div>`;
  const letter = (cat?.name||'?')[0].toUpperCase();
  return `<div class="${cls}" style="background:${bg}">${letter}</div>`;
}

function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDark ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
  updateThemeIcon();
}

function updateThemeIcon() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const sun = document.getElementById('icon-sun');
  const moon = document.getElementById('icon-moon');
  if (sun && moon) { sun.style.display = isDark ? 'block' : 'none'; moon.style.display = isDark ? 'none' : 'block'; }
}

(function initTheme() {
  try {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  } catch(e) {}
  document.addEventListener('DOMContentLoaded', updateThemeIcon);
  setTimeout(updateThemeIcon, 0);
})();

function mesLabel(m, y) { return `${MESES[m-1]} ${y}`; }

function statusConta(item, venc) {
  const pct = item.planned_amount > 0 ? (item.paid / item.planned_amount) : 0;
  if (pct >= 0.9995) return 'pago';
  if (item.paid > 0) return 'parcial';
  if (item.type === 'fatura') return 'fatura';
  if (!venc) return 'futuro';
  const agora = new Date();
  const mesHoje = agora.getMonth() + 1;
  const anoHoje = agora.getFullYear();
  // Mês passado: tudo vencido. Mês futuro: tudo futuro. Só compara dia no mês atual.
  if (anoAtual < anoHoje || (anoAtual === anoHoje && mesAtual < mesHoje)) return 'vencido';
  if (anoAtual > anoHoje || (anoAtual === anoHoje && mesAtual > mesHoje)) return 'futuro';
  const diaHoje = agora.getDate();
  if (venc < diaHoje) return 'vencido';
  if (venc === diaHoje) return 'hoje';
  if (venc - diaHoje <= 3) return 'semana';
  return 'futuro';
}

function prioridadeConta(item) {
  const s = statusConta(item, item.due_day);
  if (s === 'vencido') return item.paid > 0 ? 1 : 0;
  if (s === 'hoje')    return 2;
  if (s === 'semana')  return 3;
  if (s === 'fatura' || s === 'futuro') return 4;
  if (s === 'parcial') return 5;
  if (s === 'pago')    return 6;
  return 7;
}

function getLimitForCategory(catId) {
  const s = categoryBudgets.find(b => b.category_id===catId && b.month===mesAtual && b.year===anoAtual);
  if (s) return s.limit_amount;
  const t = categoryBudgets.find(b => b.category_id===catId && !b.month);
  return t ? t.limit_amount : null;
}

// === SUPABASE ===
async function loadAll() {
  document.getElementById('btn-refresh').disabled = true;
  try {
    const [cats, pms, budgets] = await Promise.all([
      sb.from('fin_categories').select('*').order('sort_order'),
      sb.from('fin_payment_methods').select('*').order('sort_order'),
      sb.from('fin_category_budgets').select('*')
    ]);
    categories      = cats.data    || [];
    paymentMethods  = pms.data     || [];
    categoryBudgets = budgets.data || [];
    await loadMes();
  } catch(e) {
    avisar('Erro ao conectar ao banco de dados.', '');
  } finally {
    document.getElementById('btn-refresh').disabled = false;
  }
}

async function propagarRecorrentes() {
  const prevM = mesAtual === 1 ? 12 : mesAtual - 1;
  const prevA = mesAtual === 1 ? anoAtual - 1 : anoAtual;
  const { data: prevCmts } = await sb.from('fin_commitments')
    .select('name, category_id, type, planned_amount, due_day, default_payment_method_id, recurrence_type')
    .eq('month', prevM).eq('year', prevA)
    .neq('recurrence_type', 'pontual')
    .neq('type', 'fatura');
  if (!prevCmts || prevCmts.length === 0) return 0;
  const existingNames = new Set(commitments.map(c => c.name));
  const toInsert = prevCmts.filter(c => !existingNames.has(c.name));
  for (const c of toInsert) {
    await insertCommitment({ month: mesAtual, year: anoAtual, name: c.name, category_id: c.category_id, type: c.type, planned_amount: c.planned_amount, due_day: c.due_day, default_payment_method_id: c.default_payment_method_id, recurrence_type: c.recurrence_type });
  }
  return toInsert.length;
}

async function loadMes(propagate = true) {
  document.getElementById('mes-label').textContent = mesLabel(mesAtual, anoAtual);
  dirtyTabs = new Set(['dashboard','planejamento','pagar','gastos','faturas','perfil']);

  const prevM = mesAtual === 1 ? 12 : mesAtual - 1;
  const prevA = mesAtual === 1 ? anoAtual - 1 : anoAtual;

  const [cmts, spend, spSum, inc, incPrev] = await Promise.all([
    sb.from('fin_commitment_summary').select('*').eq('month', mesAtual).eq('year', anoAtual).order('due_day'),
    sb.from('fin_spending_entries').select('*').eq('month', mesAtual).eq('year', anoAtual).order('spend_date', {ascending:false}),
    sb.from('fin_spending_summary').select('*').eq('month', mesAtual).eq('year', anoAtual),
    sb.from('fin_income_entries').select('*').eq('month', mesAtual).eq('year', anoAtual).order('entry_date'),
    sb.from('fin_income_entries').select('*').eq('month', prevM).eq('year', prevA).order('entry_date')
  ]);

  commitments      = cmts.data    || [];
  spendingEntries  = spend.data   || [];
  spendingSummary  = spSum.data   || [];
  incomeEntries    = inc.data     || [];
  prevIncomeEntries = incPrev.data || [];

  const { data: rawCmts } = await sb.from('fin_commitments')
    .select('id, default_payment_method_id, recurrence_type')
    .eq('month', mesAtual).eq('year', anoAtual);
  const pmMap  = Object.fromEntries((rawCmts||[]).map(r => [r.id, r.default_payment_method_id]));
  const recMap = Object.fromEntries((rawCmts||[]).map(r => [r.id, r.recurrence_type]));
  commitments.forEach(c => {
    c.default_payment_method_id = pmMap[c.id] || null;
    c.recurrence_type = recMap[c.id] || 'manual';
  });

  // Auto-propagate: se o mês não tem recorrentes, copia do mês anterior
  if (propagate && commitments.filter(c => c.recurrence_type !== 'pontual').length === 0) {
    const n = await propagarRecorrentes();
    if (n > 0) { await loadMes(false); return; }
  }

  renderAtivo();
  dirtyTabs.delete(abaAtiva);
}

async function insertSpending(catId, cardId, amount, description, date) {
  const m = parseInt(date.slice(5,7)), y = parseInt(date.slice(0,4));
  const { data, error } = await sb.from('fin_spending_entries').insert({
    month: m, year: y, category_id: catId, payment_method_id: cardId,
    amount: Number(amount), description, spend_date: date
  }).select().single();
  if (error) throw error;
  return data;
}

async function insertCommitment(payload) {
  const { data, error } = await sb.from('fin_commitments').insert(payload).select().single();
  if (error) throw error;
  return data;
}

async function insertPayment(commitmentId, amount, methodId, note, date) {
  const { data, error } = await sb.from('fin_commitment_payments').insert({
    commitment_id: commitmentId,
    amount: Number(amount),
    payment_method_id: methodId || null,
    note: note || null,
    payment_date: date || new Date().toISOString().slice(0,10)
  }).select().single();
  if (error) throw error;
  return data;
}

// === DASHBOARD ===
function renderDashboard() {
  const el = document.getElementById('dash-root');
  // Sobra Projetada: entradas do mês - total comprometido planejado
  const totalEntradas     = incomeEntries.reduce((s,e) => s + Number(e.amount), 0);
  const totalComprometido = commitments.reduce((s,c) => s + Number(c.planned_amount), 0);
  const totalPago         = commitments.reduce((s,c) => s + Number(c.paid || 0), 0);
  const sobraProjetada    = totalEntradas - totalComprometido;
  // Sobra Real: entradas do mês - gastos reais lançados até agora
  const totalGasto        = spendingEntries.reduce((s,e) => s + Number(e.amount), 0);
  const sobraReal         = totalEntradas - totalGasto;
  const totalPrevEntradas = prevIncomeEntries.reduce((s,e) => s + Number(e.amount), 0);
  const projClass = sobraProjetada >= 0 ? 'green' : 'red';
  const realClass = sobraReal >= 0 ? 'green' : 'red';

  const spendByCat = {};
  // Apenas gastos reais lançados — "acima do teto" só dispara quando há gastos registrados
  spendingEntries.forEach(e => {
    const cat = categories.find(c => c.id === e.category_id);
    const key = cat ? cat.name : 'Sem categoria';
    const catRef = cat || { id: e.category_id, name: key };
    if (!spendByCat[key]) spendByCat[key] = { spent: 0, catId: e.category_id, cat: catRef };
    spendByCat[key].spent += Number(e.amount);
  });
  // Planejamento (commitments) afeta sobraProjetada — não conta como gasto real aqui

  const catsWithBudget = categories.filter(c => getLimitForCategory(c.id) !== null);
  const paceHtml = catsWithBudget.map(cat => {
    const lim   = getLimitForCategory(cat.id);
    const spent = (spendByCat[cat.name] || {spent:0}).spent;
    const pct   = lim > 0 ? Math.min((spent/lim)*100, 120) : 0;
    const barPct = Math.min(pct, 100);
    const barClass   = pct>=100 ? 'red' : pct>=80 ? 'amber' : '';
    const badgeClass = pct>=100 ? 'over' : pct>=80 ? 'warn' : 'ok';
    const badgeText  = pct>=100 ? `+R$${fmt(spent-lim)}` : `${pct.toFixed(0)}%`;
    return `
      <div class="pace-card" style="cursor:pointer" onclick="abrirCatDrilldown('${esc(cat.id)}','${esc(cat.name)}')">
        <div class="pace-header">
          <div class="pace-name" style="display:flex;align-items:center;gap:8px">${catAvatar(cat,'sm')} ${esc(cat.name)}</div>
          <div class="pace-badge ${badgeClass}">${badgeText}</div>
        </div>
        <div class="pace-amounts"><span>R$ ${fmt(spent)}</span><span>Teto: R$ ${fmt(lim)}</span></div>
        <div class="progress-bar"><div class="progress-fill ${barClass}" style="width:${barPct}%"></div></div>
      </div>`;
  }).join('');

  // Categorias com gastos reais mas sem teto definido
  const budgetCatIds = new Set(catsWithBudget.map(c => c.id));
  const semTetoHtml = Object.entries(spendByCat)
    .filter(([, d]) => d.spent > 0 && !budgetCatIds.has(d.catId))
    .sort((a, b) => b[1].spent - a[1].spent)
    .map(([name, d]) => `
      <div class="pace-card sem-teto" style="cursor:pointer" onclick="abrirCatDrilldown('${esc(d.catId)}','${esc(name)}')">
        <div class="pace-header">
          <div class="pace-name" style="display:flex;align-items:center;gap:8px">${catAvatar(d.cat,'sm')} ${esc(name)}</div>
          <div class="pace-badge sem-teto-badge">sem teto</div>
        </div>
        <div class="pace-amounts"><span>R$ ${fmt(d.spent)}</span></div>
      </div>`).join('');

  const sorted = Object.entries(spendByCat).sort((a,b) => b[1].spent - a[1].spent);

}

function renderPlanejamento() {
  const el = document.getElementById('planejamento-root');
  const totalComprometido = commitments.reduce((s,c) => s + Number(c.planned_amount), 0);

  const automaticas = commitments.filter(c => c.recurrence_type === 'automatico').sort((a,b) => (a.due_day||99)-(b.due_day||99));
  const manuais     = commitments.filter(c => c.recurrence_type === 'manual').sort((a,b) => (a.due_day||99)-(b.due_day||99));
  const pontuais    = commitments.filter(c => c.recurrence_type === 'pontual').sort((a,b) => (a.due_day||99)-(b.due_day||99));

  function buildPlanCard(c) {
    const cat   = categories.find(x => x.id === c.category_id);
    const badge = c.recurrence_type === 'automatico'
      ? `<span class="badge badge-auto">Automático</span>`
      : c.recurrence_type === 'pontual'
        ? `<span class="badge badge-futuro">Pontual</span>`
        : `<span class="badge badge-manual">Manual</span>`;
    const dayLabel = c.due_day ? `Dia ${c.due_day}` : 'Sem vencimento';
    return `
      <div class="plan-card">

function buildContaCard(c) {
  const venc   = c.due_day;
  const status = statusConta(c, venc);
  const paid   = Number(c.paid);
  const rem    = Number(c.remaining);
  const plan   = Number(c.planned_amount);
  const pct    = plan > 0 ? Math.min((paid/plan)*100, 100) : 0;
  const barClass = pct>=100 ? 'green' : pct>=50 ? 'amber' : '';
  const isPaid = status === 'pago';
  const isOverdue = status === 'vencido';
  const isToday   = status === 'hoje';

  const defPm     = c.default_payment_method_id ? paymentMethods.find(p => p.id===c.default_payment_method_id) : null;
  const defPmBadge = defPm ? `<span class="badge badge-fatura" style="margin-left:6px">${esc(defPm.name)}</span>` : '';

  const badgeMap = {
    pago:    `<span class="badge badge-pago">✓ Pago</span>`,
    parcial: `<span class="badge badge-parcial">Parcial</span>`,
    vencido: `<span class="badge badge-vencido">Vencido</span>`,
    hoje:    `<span class="badge badge-hoje">Vence hoje</span>`,
    semana:  `<span class="badge badge-semana">Em breve</span>`,
    futuro:  `<span class="badge badge-futuro">Dia ${venc||'?'}</span>`,
    fatura:  `<span class="badge badge-fatura">Fatura</span>`
  };

  const diff = paid - plan;
  const diffHtml = isPaid
    ? diff > 0.005
      ? `<div class="pag-diff over">+R$ ${fmt(diff)} acima do previsto</div>`
      : diff < -0.005
        ? `<div class="pag-diff under">-R$ ${fmt(Math.abs(diff))} economizado</div>`
        : `<div class="pag-diff exact">Valor exato ✓</div>`
    : '';

  const payBtn = isPaid
    ? `<div style="display:flex;gap:8px;align-items:stretch">
        <div class="btn-pay-full paid-btn" style="flex:1">Pago · R$ ${fmt(paid)}</div>
        <button class="btn-pay-edit" onclick="abrirPagamentoModal('${esc(c.id)}')" style="display:flex;align-items:center;gap:5px">${ICO_PENCIL} Editar</button>
       </div>`
    : `<button class="btn-pay-full" onclick="abrirPagamentoModal('${esc(c.id)}')">
        ${paid > 0 ? '+ Adicionar pagamento' : 'Registrar pagamento'}
       </button>`;

  return `
    <div class="conta-card ${isOverdue?'overdue':''} ${isToday?'today':''}">
      <button class="menu-btn" onclick="toggleMenu('${esc(c.id)}')">⋯</button>
      <div class="menu-popup" id="menu-${esc(c.id)}">
        <button class="menu-item" onclick="abrirEditarCommitment('${esc(c.id)}');fecharMenus()" style="display:flex;align-items:center;gap:8px">${ICO_PENCIL} Editar</button>
        <button class="menu-item danger" onclick="deletarCommitment('${esc(c.id)}','${esc(c.name)}');fecharMenus()" style="display:flex;align-items:center;gap:8px">${ICO_TRASH} Excluir</button>
      </div>
      <div class="conta-top">
        <div class="conta-left">
          <div class="conta-name">${esc(c.name)}</div>
          <div class="conta-meta">${c.category_name ? esc(c.category_name) : ''}${c.due_day?' · Dia '+c.due_day:''}${c.type==='parcelado'&&c.installment_current?` · ${c.installment_current}/${c.installment_total}`:''}</div>
          ${badgeMap[status]||''}${defPmBadge}
        </div>
        <div class="conta-right">
          <div class="conta-val ${isPaid&&diff>0.005?'red':''}" style="font-size:${isPaid?'12px':'16px'};${isPaid?'color:var(--text-2)':''}">Prev. R$ ${fmt(plan)}</div>
          ${isPaid?`<div class="conta-val">R$ ${fmt(paid)}</div>`:''}
          ${paid>0&&!isPaid?`<div class="conta-paid">Pago: R$ ${fmt(paid)}</div>`:''}
          ${rem>0.005?`<div class="conta-rem">Falta: R$ ${fmt(rem)}</div>`:''}
        </div>
      </div>
      ${diffHtml}
      ${pct>0&&!isPaid?`<div class="conta-prog"><div class="progress-bar"><div class="progress-fill ${barClass}" style="width:${pct}%"></div></div></div>`:''}
      ${payBtn}
    </div>`;
}

function toggleMenu(id) {
  const m = document.getElementById(`menu-${id}`);
  if (!m) return;
  const open = m.classList.contains('open');
  fecharMenus();
  if (!open) m.classList.add('open');
}
function fecharMenus() {
  document.querySelectorAll('.menu-popup.open').forEach(m => m.classList.remove('open'));
}
document.addEventListener('click', e => {
  if (!e.target.closest('.menu-btn') && !e.target.closest('.menu-popup')) fecharMenus();
});

async function abrirPagamentoModal(id) {
  const c = commitments.find(x => x.id===id);
  if (!c) return;
  const rem  = Number(c.remaining);
  const plan = Number(c.planned_amount);
  const paid = Number(c.paid);
  const sugestao = (rem > 0.005 ? rem : plan).toFixed(2);

  const pmOpts = paymentMethods.filter(p => p.active !== false).map(p => {
    const typeLabel = p.type==='credito'?'Crédito':p.type==='debito'?'Débito':p.type==='pix'?'PIX':'Dinheiro';
    return `<div class="method-opt" data-pm-id="${esc(p.id)}" data-pm-type="${esc(p.type)}" onclick="selecionarMetodo('${esc(p.id)}')">
      <div class="method-opt-icon" style="font-size:10px;font-weight:700;color:var(--text-3)">${typeLabel}</div>
      <div>${esc(p.name)}</div>
    </div>`;
  }).join('');

  // Buscar pagamentos existentes
  const { data: pagamentos } = await sb.from('fin_commitment_payments')
    .select('*').eq('commitment_id', id).order('payment_date');

  const pagListHtml = (pagamentos||[]).length ? `
    <div style="font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Pagamentos registrados</div>
    ${(pagamentos||[]).map(pg => {
      const pm = paymentMethods.find(p => p.id===pg.payment_method_id);
      const dataFmt = pg.payment_date ? new Date(pg.payment_date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}) : '';
      return `<div class="pay-hist-item">
        <div class="pay-hist-info">
          <span class="pay-hist-val">R$ ${fmt(pg.amount)}</span>
          <span class="pay-hist-meta">${pm?esc(pm.name):''}${dataFmt?' · '+dataFmt:''}</span>
        </div>
        <button class="btn-card-act btn-card-del" onclick="deletarPagamento('${esc(pg.id)}','${esc(id)}')" style="display:flex;align-items:center;justify-content:center">${ICO_TRASH}</button>
      </div>`;
    }).join('')}
    <div style="border-top:1px solid #1a1a1a;margin:12px 0"></div>` : '';

  const paidInfo = paid > 0.005 ? `<span style="color:var(--text-3)"> · já pago: R$ ${fmt(paid)}</span>` : '';

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">Pagamento</div>
    <div style="font-size:14px;color:var(--text-2);margin-bottom:4px">${esc(c.name)}</div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:16px">Previsto: <strong style="color:var(--text-1)">R$ ${fmt(plan)}</strong>${paidInfo}</div>
    ${pagListHtml}
    <div class="field">
      <label>Valor pago (R$)</label>
      <input type="number" id="pay-val" value="${sugestao}" step="0.01" min="0.01" inputmode="decimal" />
    </div>
    <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Pago com</div>
    <div class="method-grid">${pmOpts || '<div style="color:var(--text-3);font-size:13px;padding:8px">Nenhum método cadastrado</div>'}</div>
    <div id="credit-note" style="display:none;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--accent);margin-bottom:12px">
      Lançado na fatura do cartão (próximo mês).
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="confirmarPagamento('${esc(id)}', false)" style="background:#333;flex:0.6">+ Parcial</button>
      <button class="btn-save" onclick="confirmarPagamento('${esc(id)}', true)">✓ Concluir</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
  setTimeout(() => {
    document.getElementById('pay-val')?.focus();
    if (c.default_payment_method_id) selecionarMetodo(c.default_payment_method_id);
  }, 100);
}

async function deletarPagamento(pagId, commitmentId) {
  if (!confirm('Excluir este pagamento?')) return;
  const { error } = await sb.from('fin_commitment_payments').delete().eq('id', pagId);
  if (error) { showToast('Erro: '+error.message,'error'); return; }
  await loadMes();
  showToast('Pagamento removido','success');
  // Reabrir modal com dados atualizados
  abrirPagamentoModal(commitmentId);
}

function selecionarMetodo(pmId) {
  document.querySelectorAll('.method-opt').forEach(el => el.classList.remove('selected'));
  const el = document.querySelector(`.method-opt[data-pm-id="${pmId}"]`);
  if (el) el.classList.add('selected');
  const note = document.getElementById('credit-note');
  if (note) note.style.display = (el?.dataset.pmType === 'credito') ? 'block' : 'none';
}

async function confirmarPagamento(id, concluir = true) {
  const c   = commitments.find(x => x.id===id);
  const val = parseFloat(document.getElementById('pay-val')?.value);
  if (!c || !val || val <= 0) { showToast('Informe um valor válido','error'); return; }

  const sel    = document.querySelector('.method-opt.selected');
  const pmId   = sel?.dataset.pmId   || null;
  const pmType = sel?.dataset.pmType || null;

  fecharModal();

  const prevPaid = Number(c.paid);
  const totalPago = prevPaid + val;
  c.paid      = totalPago;
  c.remaining = concluir ? 0 : Number(c.planned_amount) - totalPago;
  if (concluir) c.planned_amount = totalPago;
  renderPagar();
  dirtyTabs.add('dashboard');
  dirtyTabs.add('pagar');

  try {
    await insertPayment(id, val, pmId, null, null);
    // Se "Concluir": atualiza planned_amount para o valor real pago
    if (concluir) {
      await sb.from('fin_commitments').update({ planned_amount: totalPago }).eq('id', id);
    }
    if (pmType === 'credito' && pmId) {
      const hoje = new Date().toISOString().slice(0,10);
      await insertSpending(c.category_id || null, pmId, val, c.name, hoje);
    }
    await loadMes();
    showToast(`R$ ${fmt(val)} ${concluir ? 'pago e concluído ✓' : 'registrado (parcial)'}`, 'success');
  } catch(e) {
    c.paid          = prevPaid;
    c.remaining     = Number(c.planned_amount) - prevPaid;
    c.planned_amount = Number(c.planned_amount);
    renderPagar();
    showToast('Erro ao registrar pagamento','error');
  }
}

async function salvarEdicao() {
  const id             = document.getElementById('edit-id').value;
  const nome           = document.getElementById('edit-nome').value.trim();
  const catId          = document.getElementById('edit-cat').value || null;
  const valor          = parseFloat(document.getElementById('edit-valor').value);
  const dia            = parseInt(document.getElementById('edit-dia').value) || null;
  const recurrenceType = document.getElementById('edit-recurrence')?.value || 'manual';
  const autoOn         = document.getElementById('edit-auto-toggle')?.checked;
  const defPmId        = autoOn ? (document.getElementById('edit-card')?.value || null) : null;
  const tipo           = recurrenceType === 'pontual' ? 'pontual' : 'fixo';
  const repMode        = document.querySelector('input[name="edit-rep"]:checked')?.value || 'unico';
  const nMeses         = Math.max(1, parseInt(document.getElementById('edit-meses')?.value) || 6);
  const nParcelas      = Math.max(1, parseInt(document.getElementById('edit-parcelas')?.value) || 6);
  if (!nome || !valor || valor<=0) { showToast('Preencha nome e valor','error'); return; }

  function addMeses(m, a, n) {
    const total = (a * 12 + m - 1) + n;
    return { month: (total % 12) + 1, year: Math.floor(total / 12) };
  }

  const btn = document.querySelector('#modal-content .btn-save');
  if (btn) btn.disabled = true;
  try {
    const { error } = await sb.from('fin_commitments').update({ name: nome, category_id: catId, planned_amount: valor, due_day: dia, type: tipo, recurrence_type: recurrenceType, default_payment_method_id: defPmId }).eq('id', id);
    if (error) throw error;

    if (repMode === 'parcelar' && nParcelas >= 1) {
      for (let i = 1; i <= nParcelas; i++) {
        const { month, year } = addMeses(mesAtual, anoAtual, i);
        await insertCommitment({ month, year, name: `${nome} (${i+1}/${nParcelas+1})`, category_id: catId, type: 'pontual', planned_amount: valor, due_day: dia, default_payment_method_id: defPmId, recurrence_type: 'pontual' });
      }
      fecharModal(); await loadMes(); showToast(`Atualizado + ${nParcelas} parcelas criadas ✓`, 'success');
    } else if (repMode === 'repetir' && nMeses >= 1) {
      for (let i = 1; i <= nMeses; i++) {
        const { month, year } = addMeses(mesAtual, anoAtual, i);
        await insertCommitment({ month, year, name: nome, category_id: catId, type: tipo, planned_amount: valor, due_day: dia, default_payment_method_id: defPmId, recurrence_type: recurrenceType });
      }
      fecharModal(); await loadMes(); showToast(`Atualizado + ${nMeses} meses criados ✓`, 'success');
    } else {
      fecharModal(); await loadMes(); showToast('Despesa atualizada ✓', 'success');
    }
  } catch(e) {
    if (btn) btn.disabled = false;
    showToast('Erro: '+(e.message||JSON.stringify(e)),'error');
  }
}

async function deletarCommitment(id, nome) {
  if (!confirm(`Excluir "${nome}"?`)) return;
  const { error } = await sb.from('fin_commitments').delete().eq('id', id);
  if (error) { showToast('Erro: '+error.message,'error'); return; }
  await loadMes();
  showToast('Conta removida ✓','success');
}

async function limparDuplicados() {
  const grouped = {};
  commitments.forEach(c => {
    const key = c.name.trim().toLowerCase();
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(c);
  });
  let deleted = 0;
  for (const key in grouped) {
    const dupes = grouped[key];
    if (dupes.length <= 1) continue;
    // Mantém o primeiro (menor índice = inserido primeiro), apaga o resto
    for (let i = 1; i < dupes.length; i++) {
      const { error } = await sb.from('fin_commitments').delete().eq('id', dupes[i].id);
      if (!error) deleted++;
    }
  }
  await loadMes();
  showToast(deleted > 0 ? `${deleted} duplicado(s) removido(s) ✓` : 'Nenhum duplicado encontrado', deleted > 0 ? 'success' : 'success');
}

function selecionarRec(prefix, tipo) {
  const opts = { automatico: 'auto', manual: 'manual', pontual: 'pontual' };
  Object.keys(opts).forEach(t => {
    const el = document.getElementById(`${prefix}-rec-${opts[t]}`);
    if (!el) return;
    el.className = 'rec-opt' + (t === tipo ? ` sel-${opts[t]}` : '');
  });
  const hidden = document.getElementById(`${prefix}-recurrence`);
  if (hidden) hidden.value = tipo;
  if (prefix === 'nc') {
    const rep = document.getElementById('nc-repeat-section');
    if (rep) rep.style.display = tipo === 'pontual' ? 'none' : 'block';
  }
  if (prefix === 'edit') {
    const rep = document.getElementById('edit-repeat-section');
    if (rep) rep.style.display = tipo === 'pontual' ? 'none' : 'block';
  }
}

// === PAGAR ===
function renderPagar() {
  const el = document.getElementById('pagar-root');

  // Somente contas COM data de vencimento (com due_day = é uma conta a pagar)
  const pagarCmts = commitments.filter(c => c.due_day != null);

  const totalFaltante = pagarCmts.reduce((s,c) => s + Math.max(Number(c.remaining),0), 0);
  const qtdQuitadas   = pagarCmts.filter(c => Number(c.remaining) <= 0.005).length;

  const sorted = [...pagarCmts].sort((a,b) => prioridadeConta(a)-prioridadeConta(b) || (a.due_day||99)-(b.due_day||99));
  const PRIO_LABEL = ['Vencidas','Vencidas (parcial)','Hoje','Esta semana','Próximas','Pagas','Futuras'];
  let lastPrio = -1;
  const cmtHtml = sorted.map(c => {
    const p = prioridadeConta(c);
    let div = '';
    if (p !== lastPrio) { lastPrio = p; div = `<div class="secao-divider">${PRIO_LABEL[Math.min(p, PRIO_LABEL.length-1)]}</div>`; }
    return div + buildContaCard(c);
  }).join('');

  el.innerHTML = `
    <div class="hero">
      <div class="hero-eyebrow">Total a Pagar</div>
      <div class="hero-number ${totalFaltante > 0 ? 'red' : 'green'}">R$ ${fmt(totalFaltante)}</div>
      <div class="hero-sub">${qtdQuitadas} de ${pagarCmts.length} contas pagas</div>
    </div>
    <div class="hero-divider"></div>
    ${cmtHtml || '<div class="empty-state">Nenhuma conta para pagar<br><small style="margin-top:8px;display:block">Adicione despesas manuais no Planejamento</small></div>'}
  `;
}

    const cardEntries  = spendingSummary.filter(s => s.card_id===card.id);

    const parceladoItems = commitments.filter(c => c.default_payment_method_id===card.id && c.recurrence_type==='pontual' && c.due_day===null);

    const autoTotal      = autoItems.reduce((s,c) => s+Number(c.planned_amount), 0);

function renderGastos() {
  const el = document.getElementById('gastos-root');
  const catOpts = categories.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  const pmOpts  = paymentMethods.filter(p => p.active!==false).map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  const totalGasto = spendingEntries.reduce((s,e) => s+Number(e.amount), 0);
  const hoje = new Date().toISOString().slice(0,10);

  const byDay = {};
  spendingEntries.forEach(e => {
    const d = e.spend_date ? e.spend_date.slice(0,10) : 'sem-data';
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(e);
  });

  const listaHtml = Object.keys(byDay).sort((a,b)=>b.localeCompare(a)).map(d => {
    const label = d==='sem-data' ? 'Sem data' : new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
    const items = byDay[d].map(e => {
      const cat = categories.find(c => c.id===e.category_id);
      const pm  = paymentMethods.find(p => p.id===e.payment_method_id);
      return `
        <div class="gasto-item">
          <div class="gasto-emoji">${catAvatar(cat,'sm')}</div>
          <div class="gasto-info">
            <div class="gasto-desc">${esc(e.subcategory||e.description||cat?.name||'Gasto')}</div>
            <div class="gasto-meta">${esc(cat?.name||'')}${e.subcategory&&e.description?' · '+esc(e.description):''}${pm?' · '+esc(pm.name):''}</div>
          </div>
          <div class="gasto-valor">R$${fmt(e.amount)}</div>
          <button class="gasto-del" onclick="deletarGasto('${esc(e.id)}')">${ICO_TRASH}</button>
        </div>`;
    }).join('');
    return `<div class="gastos-group-day"><div class="gastos-day-label">${label}</div>${items}</div>`;
  }).join('');

  el.innerHTML = `
    <div class="hero">
      <div class="hero-eyebrow">Gasto do Mês</div>
      <div class="hero-number red">R$ ${fmt(totalGasto)}</div>
      <div class="hero-sub">${spendingEntries.length} lançamento${spendingEntries.length!==1?'s':''}</div>
    </div>
    <div class="hero-divider"></div>

    <div class="gastos-form">
      <div class="gastos-form-title">Registrar gasto</div>
      <div class="field-row">
        <div class="field"><label>Valor (R$)</label>
          <input type="number" id="g-valor" placeholder="0,00" min="0" step="0.01" inputmode="decimal" oninput="atualizarParcPreview()" />
        </div>
        <div class="field"><label>Categoria</label>
          <select id="g-cat" onchange="atualizarSubcatList()">${catOpts}</select>
        </div>
      </div>
      <div class="field" style="position:relative">
        <label>Subcategoria</label>
        <input type="text" id="g-subcat" placeholder="Selecione ou digite..." autocomplete="off"
               onfocus="mostrarSubcatDropdown()" oninput="filtrarSubcatDropdown(this.value)"
               onblur="setTimeout(fecharSubcatDropdown,150)" />
        <div id="subcat-dropdown" class="subcat-dropdown" style="display:none"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Método</label><select id="g-pm">${pmOpts}</select></div>
        <div class="field"><label>Data</label><input type="date" id="g-data" value="${hoje}" /></div>
      </div>
      <div class="field" style="margin-bottom:4px">
        <label>Observação (opcional)</label>
        <input type="text" id="g-desc" placeholder="Detalhes adicionais..." />
      </div>
      <div style="display:flex;align-items:center;gap:10px;padding:6px 0 2px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-2);font-size:13px;user-select:none">
          <input type="checkbox" id="toggle-parc" onchange="toggleParc()" style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer" />
          Parcelado?
        </label>
      </div>
      <div id="parc-opts" style="display:none">
        <div class="field-row">
          <div class="field"><label>Nº de parcelas</label>
            <input type="number" id="g-parcelas" value="2" min="2" max="48" oninput="atualizarParcPreview()" />
          </div>
          <div class="field" style="justify-content:flex-end;align-items:flex-end">
            <div id="parc-preview" style="color:var(--accent);font-size:12px;padding-bottom:10px;text-align:right"></div>
          </div>
        </div>
      </div>
      <button class="btn-registrar" id="btn-gasto" onclick="submitGasto()">+ Registrar gasto</button>
    </div>
    <div class="gastos-resumo">
      <div class="gr-card"><div class="gr-label">Total do mês</div><div class="gr-val red">R$${fmt(totalGasto)}</div></div>
      <div class="gr-card"><div class="gr-label">Lançamentos</div><div class="gr-val">${spendingEntries.length}</div></div>
    </div>
    ${listaHtml || '<div class="empty-state">Nenhum gasto registrado neste mês</div>'}
  `;
  setTimeout(atualizarSubcatList, 0);
}

function toggleTeto(id) {
  const el = document.getElementById(`teto-${id}`);
  if (!el) return;
  const btn = el.previousElementSibling;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  if (btn) btn.textContent = (open ? '▼' : '▲') + btn.textContent.slice(1);
}

async function addGasto() {
  const valor  = parseFloat(document.getElementById('g-valor')?.value);
  const catId  = document.getElementById('g-cat')?.value;
  const pmId   = document.getElementById('g-pm')?.value;
  const data   = document.getElementById('g-data')?.value;
  const desc   = document.getElementById('g-desc')?.value?.trim();
  const subcat = document.getElementById('g-subcat')?.value?.trim();
  if (!valor||valor<=0) { showToast('Informe um valor válido','error'); return; }
  if (!catId)           { showToast('Selecione uma categoria','error'); return; }
  if (!pmId)            { showToast('Selecione o método','error'); return; }
  const d = data || new Date().toISOString().slice(0,10);
  const m = parseInt(d.slice(5,7)), y = parseInt(d.slice(0,4));
  const { data: row, error } = await sb.from('fin_spending_entries').insert({
    month:m, year:y, category_id:catId, payment_method_id:pmId,
    amount:valor, description:desc||null, spend_date:d, subcategory:subcat||null
  }).select().single();
  if (error) { showToast('Erro: '+error.message,'error'); return; }
  spendingEntries.unshift(row);
  dirtyTabs.add('dashboard'); dirtyTabs.add('pagar');
  renderGastos();
  document.getElementById('g-valor').value  = '';
  document.getElementById('g-subcat').value = '';
  document.getElementById('g-desc').value   = '';
  showToast('Gasto registrado ✓','success');
}

function toggleParc() {
  const checked = document.getElementById('toggle-parc')?.checked;
  const opts = document.getElementById('parc-opts');
  const btn  = document.getElementById('btn-gasto');
  if (opts) opts.style.display = checked ? 'block' : 'none';
  if (btn)  btn.textContent   = checked ? 'Lançar parcelado' : '+ Registrar gasto';
  if (checked) atualizarParcPreview();
}

function atualizarParcPreview() {
  const valor = parseFloat(document.getElementById('g-valor')?.value) || 0;
  const n     = parseInt(document.getElementById('g-parcelas')?.value) || 2;
  const el    = document.getElementById('parc-preview');
  if (!el) return;
  el.textContent = (valor > 0 && n >= 2) ? `${n}x de R$ ${fmt(Math.round(valor/n*100)/100)}` : '';
}

function submitGasto() {
  if (document.getElementById('toggle-parc')?.checked) addParcelado();
  else addGasto();
}

async function addParcelado() {
  const valor  = parseFloat(document.getElementById('g-valor')?.value);
  const catId  = document.getElementById('g-cat')?.value;
  const pmId   = document.getElementById('g-pm')?.value;
  const subcat = document.getElementById('g-subcat')?.value?.trim();
  const n      = parseInt(document.getElementById('g-parcelas')?.value) || 0;
  if (!valor || valor <= 0) { showToast('Informe um valor válido', 'error'); return; }
  if (!catId)               { showToast('Selecione uma categoria', 'error'); return; }
  if (!pmId)                { showToast('Selecione o método de pagamento', 'error'); return; }
  if (n < 2 || n > 48)     { showToast('Parcelas: entre 2 e 48', 'error'); return; }
  const nome = subcat || categories.find(c => c.id === catId)?.name || 'Compra';
  const vp   = Math.round((valor / n) * 100) / 100;
  const resto = Math.round((valor - vp * (n - 1)) * 100) / 100;
  function addMesesLocal(m, a, i) {
    const total = (a * 12 + m - 1) + i;
    return { month: (total % 12) + 1, year: Math.floor(total / 12) };
  }
  const entries = [];
  for (let i = 0; i < n; i++) {
    const { month, year } = addMesesLocal(mesAtual, anoAtual, i);
    entries.push({ month, year, name: `${nome} (${i+1}/${n})`, planned_amount: i === n-1 ? resto : vp, recurrence_type: 'pontual', default_payment_method_id: pmId, category_id: catId, due_day: null, type: 'pontual' });
  }
  const { error } = await sb.from('fin_commitments').insert(entries);
  if (error) { showToast('Erro: ' + error.message, 'error'); return; }
  showToast(`${n}x de R$ ${fmt(vp)} lançadas ✓`, 'success');
  await loadMes();
}

let _subcatOpts = [];

function atualizarSubcatList() {
  const catId = document.getElementById('g-cat')?.value;
  if (!catId) { _subcatOpts = []; return; }
  const fromPlan  = commitments.filter(c => c.category_id===catId && c.name).map(c => c.name);
  const fromSpend = spendingEntries.filter(e => e.category_id===catId && e.subcategory).map(e => e.subcategory);
  _subcatOpts = [...new Set([...fromPlan, ...fromSpend])];
  fecharSubcatDropdown();
}

function mostrarSubcatDropdown() {
  renderSubcatDropdown(document.getElementById('g-subcat')?.value || '');
}

function filtrarSubcatDropdown(val) {
  renderSubcatDropdown(val);
}

function renderSubcatDropdown(filter) {
  const dd = document.getElementById('subcat-dropdown');
  if (!dd) return;
  const q = filter.trim().toLowerCase();
  const filtered = q ? _subcatOpts.filter(s => s.toLowerCase().includes(q)) : _subcatOpts;
  if (!filtered.length) { dd.style.display = 'none'; return; }
  dd.innerHTML = filtered.map(s =>
    `<div class="subcat-opt" onmousedown="selecionarSubcat('${esc(s)}')">${esc(s)}</div>`
  ).join('');
  dd.style.display = 'block';
}

function selecionarSubcat(val) {
  const inp = document.getElementById('g-subcat');
  if (inp) { inp.value = val; }
  fecharSubcatDropdown();
}

function fecharSubcatDropdown() {
  const dd = document.getElementById('subcat-dropdown');
  if (dd) dd.style.display = 'none';
}

document.addEventListener('click', e => {
  if (!e.target.closest('.field')) fecharSubcatDropdown();
});

function setFiltroGastos(catId) {
  filtroGastosCat = catId;
  renderGastos();
}

async function deletarGasto(id) {
  if (!confirm('Remover este lançamento?')) return;
  const { error } = await sb.from('fin_spending_entries').delete().eq('id', id);
  if (error) { showToast('Erro ao remover','error'); return; }
  spendingEntries = spendingEntries.filter(e => e.id!==id);
  dirtyTabs.add('dashboard'); dirtyTabs.add('pagar');
  renderGastos();
  showToast('Lançamento removido','success');
}

function carregarPerfil() {
  try { return JSON.parse(localStorage.getItem('oiv2_perfil')||'{}'); } catch { return {}; }
}

function salvarPerfil() {
  const nome = document.getElementById('p-nome')?.value?.trim() || '';
  const dia  = parseInt(document.getElementById('p-dia')?.value) || null;
  const p = carregarPerfil();
  p.nome = nome; p.diaRecebimento = dia;
  localStorage.setItem('oiv2_perfil', JSON.stringify(p));
  showToast('Perfil salvo ✓','success');
}

async function salvarIncomeEntry() {

async function deletarIncomeEntry(id) {

}

// === CRUD CATEGORIAS ===
const EMOJIS_SUGERIDOS = ['🏠','🚗','🍔','🛒','💊','🎮','📚','✈️','👕','🐾','💡','📱','🎬','🏋️','💰','🎁'];

function abrirCatModal(catId) {
  const cat = catId ? categories.find(c => c.id === catId) : null;
  const emojiOpts = EMOJIS_SUGERIDOS.map(e =>
    `<span class="emoji-opt${cat?.emoji===e?' sel':''}" onclick="selecionarEmoji(this,'${e}')">${e}</span>`
  ).join('');
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${cat ? 'Editar categoria' : 'Nova categoria'}</div>
    <input type="hidden" id="cat-id" value="${esc(catId||'')}" />
    <div class="field"><label>Emoji</label>
      <div class="emoji-picker">${emojiOpts}</div>
      <input type="text" id="cat-emoji" value="${esc(cat?.emoji||'')}" maxlength="2" placeholder="Ou digite um emoji..." style="margin-top:4px" />
    </div>
    <div class="field"><label>Nome</label>
      <input type="text" id="cat-nome" value="${esc(cat?.name||'')}" placeholder="Ex: Alimentação, Moradia..." />
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarCategoria()">Salvar</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('cat-nome')?.focus(), 100);
}

function selecionarEmoji(el, emoji) {
  document.querySelectorAll('.emoji-opt').forEach(e => e.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('cat-emoji').value = emoji;
}

async function salvarCategoria() {
  const catId = document.getElementById('cat-id').value;
  const emoji = document.getElementById('cat-emoji').value.trim() || '•';
  const nome  = document.getElementById('cat-nome').value.trim();
  if (!nome) { showToast('Informe o nome da categoria','error'); return; }
  try {
    if (catId) {
      const { error } = await sb.from('fin_categories').update({ name: nome, emoji }).eq('id', catId);
      if (error) throw error;
    } else {
      const { error } = await sb.from('fin_categories').insert({ name: nome, emoji });
      if (error) throw error;
    }
    const { data } = await sb.from('fin_categories').select('*').order('sort_order');
    categories = data || [];
    fecharModal();
    renderPerfil();
    dirtyTabs.add('planejamento'); dirtyTabs.add('pagar'); dirtyTabs.add('dashboard');
    showToast(catId ? 'Categoria atualizada ✓' : 'Categoria criada ✓', 'success');
  } catch(e) { showToast('Erro: '+(e.message||JSON.stringify(e)),'error'); }
}

async function deletarCategoria(id, nome) {
  if (!confirm(`Excluir categoria "${nome}"?`)) return;
  const { count } = await sb.from('fin_commitments').select('id', { count: 'exact', head: true }).eq('category_id', id);
  if (count > 0) { showToast('Categoria em uso, remova as despesas primeiro','error'); return; }
  const { error } = await sb.from('fin_categories').delete().eq('id', id);
  if (error) { showToast('Erro: '+error.message,'error'); return; }
  categories = categories.filter(c => c.id !== id);
  renderPerfil();
  dirtyTabs.add('planejamento'); dirtyTabs.add('pagar'); dirtyTabs.add('dashboard');
  showToast('Categoria removida','success');
}

function abrirCartaoModal(pmId) {
  const pm = pmId ? paymentMethods.find(p => p.id===pmId) : null;
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${pm?'Editar cartão':'Novo cartão / método'}</div>
    <input type="hidden" id="cart-id" value="${esc(pmId||'')}" />
    <div class="field"><label>Nome</label>
      <input type="text" id="cart-nome" value="${esc(pm?.name||'')}" placeholder="Ex: Nubank, Itaú Débito..." />
    </div>
    <div class="field"><label>Tipo</label>
      <select id="cart-tipo">
        <option value="credito"  ${pm?.type==='credito'?'selected':''}>Crédito</option>
        <option value="debito"   ${pm?.type==='debito'?'selected':''}>Débito</option>
        <option value="pix"      ${pm?.type==='pix'?'selected':''}>Pix / Transferência</option>
        <option value="dinheiro" ${pm?.type==='dinheiro'?'selected':''}>Dinheiro</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field"><label>Dia vencimento (crédito)</label>
        <input type="number" id="cart-dia" value="${pm?.billing_day||''}" min="1" max="31" placeholder="Ex: 10" />
      </div>
      <div class="field"><label>Cor</label>
        <input type="color" id="cart-cor" value="${pm?.color||'#6366f1'}" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarCartao()">Salvar</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

async function salvarCartao() {
  const btn = document.querySelector('#modal-content .btn-save');
  if (btn?.disabled) return;
  if (btn) btn.disabled = true;
  const pmId = document.getElementById('cart-id').value;
  const nome = document.getElementById('cart-nome').value.trim();
  const tipo = document.getElementById('cart-tipo').value;
  const dia  = parseInt(document.getElementById('cart-dia').value) || null;
  const cor  = document.getElementById('cart-cor').value;
  if (!nome) { showToast('Informe o nome','error'); if (btn) btn.disabled = false; return; }
  try {
    if (pmId) {
      const { error: upErr } = await sb.from('fin_payment_methods').update({name:nome,type:tipo,billing_day:dia,color:cor}).eq('id',pmId);
      if (upErr) throw upErr;
    } else {
      await sb.from('fin_payment_methods').insert({name:nome,type:tipo,billing_day:dia,color:cor});
    }
    const { data } = await sb.from('fin_payment_methods').select('*').order('sort_order');
    paymentMethods = data || [];
    fecharModal();
    renderPerfil();
    showToast('Cartão salvo ✓','success');
  } catch(e) { if (btn) btn.disabled = false; showToast('Erro: '+(e.message||JSON.stringify(e)),'error'); }
}

async function deletarCartao(id, nome) {
  if (!confirm(`Excluir "${nome}"?`)) return;
  const { error } = await sb.from('fin_payment_methods').delete().eq('id', id);
  if (error) { showToast('Erro: '+error.message,'error'); return; }
  paymentMethods = paymentMethods.filter(p => p.id!==id);
  renderPerfil();
  showToast('Cartão removido','success');
}

// === TETOS DE GASTOS ===
function abrirTetoModal(catId) {
  const cat    = categories.find(c => c.id === catId);
  const budget = categoryBudgets.find(b => b.category_id === catId && !b.month);
  const valorAtual = budget ? Number(budget.limit_amount).toFixed(2) : '';
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title" style="display:flex;align-items:center;gap:8px">${catAvatar(cat,'sm')} Teto — ${esc(cat?.name||'Categoria')}</div>
    <input type="hidden" id="teto-cat-id" value="${esc(catId)}" />
    <div class="field">
      <label>Limite mensal (R$)</label>
      <input type="number" id="teto-valor" value="${valorAtual}" step="0.01" min="0" placeholder="Ex: 1500,00" inputmode="decimal" />
    </div>
    <p style="font-size:12px;color:var(--text-3);margin-bottom:12px">Deixe vazio ou zero para remover o teto.</p>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarTeto()">Salvar</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('teto-valor')?.focus(), 100);
}

async function salvarTeto() {
  const catId = document.getElementById('teto-cat-id').value;
  const valor = parseFloat(document.getElementById('teto-valor').value) || 0;
  try {
    const existing = categoryBudgets.find(b => b.category_id === catId && !b.month);
    if (valor > 0) {
      if (existing) {
        const { error } = await sb.from('fin_category_budgets').update({ limit_amount: valor }).eq('id', existing.id);
        if (error) throw error;
      } else {
        const { error } = await sb.from('fin_category_budgets').insert({ category_id: catId, limit_amount: valor });
        if (error) throw error;
      }
    } else if (existing) {
      const { error } = await sb.from('fin_category_budgets').delete().eq('id', existing.id);
      if (error) throw error;
    }
    const { data } = await sb.from('fin_category_budgets').select('*');
    categoryBudgets = data || [];
    fecharModal();
    renderPerfil();
    dirtyTabs.add('dashboard');
    showToast(valor > 0 ? 'Teto salvo ✓' : 'Teto removido', 'success');
  } catch(e) { showToast('Erro: '+(e.message||JSON.stringify(e)), 'error'); }
}

function abrirCatDrilldown(catId, catName) {
  const cat = categories.find(c => c.id === catId);
  const catCommitments = commitments.filter(c => c.category_id === catId && c.recurrence_type === 'automatico' && c.due_day === null);
  const catEntries = spendingEntries.filter(e => e.category_id === catId).sort((a,b) => (b.spend_date||'').localeCompare(a.spend_date||''));
  const totalAuto   = catCommitments.reduce((s,c) => s + Number(c.planned_amount), 0);
  const totalManual = catEntries.reduce((s,e) => s + Number(e.amount), 0);
  const totalCat    = totalAuto + totalManual;

  const commitRowsHtml = catCommitments.length ? `
    <div style="font-size:11px;color:var(--text-3);font-weight:600;padding:10px 0 4px;text-transform:uppercase;letter-spacing:.05em">Comprometido</div>
    ${catCommitments.map(c => `
      <div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text-2)">${esc(c.name)}</span>
        <span style="font-size:13px;color:var(--text-1);font-weight:500">R$ ${fmt(c.planned_amount)}</span>
      </div>`).join('')}` : '';

  const entryRowsHtml = catEntries.length ? `
    <div style="font-size:11px;color:var(--text-3);font-weight:600;padding:10px 0 4px;text-transform:uppercase;letter-spacing:.05em">Lançamentos</div>
    ${catEntries.map(e => {
      const pm = paymentMethods.find(p => p.id === e.payment_method_id);
      const dl = e.spend_date ? new Date(e.spend_date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}) : '';
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-size:13px;color:var(--text-2)">${esc(e.subcategory||e.description||'Gasto')}</div>
            <div style="font-size:11px;color:var(--text-3)">${dl}${pm?' · '+esc(pm.name):''}</div>
          </div>
          <span style="font-size:13px;color:var(--text-1);font-weight:500">R$ ${fmt(e.amount)}</span>
        </div>`;
    }).join('')}` : '';

  const emptyHtml = !catCommitments.length && !catEntries.length
    ? '<div style="text-align:center;color:var(--text-3);padding:24px 0;font-size:13px">Nenhum lançamento nesta categoria</div>' : '';

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title" style="display:flex;align-items:center;gap:8px">${catAvatar(cat,'sm')} ${esc(catName)}</div>
    <div style="text-align:center;padding:4px 0 14px">
      <div style="font-size:26px;font-weight:700;color:var(--text-1)">R$ ${fmt(totalCat)}</div>
      <div style="font-size:12px;color:var(--text-3);margin-top:2px">total no mês</div>
    </div>
    ${commitRowsHtml}${entryRowsHtml}${emptyHtml}
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Fechar</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

// === MODAL ===
function fecharModal(e) {
  if (e instanceof Event && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.add('hidden');
}

// === ROUTING ===
function switchTab(tab) {
  abaAtiva = tab;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-content').forEach(p => p.classList.toggle('active', p.id==='tab-'+tab));
  if (dirtyTabs.has(tab)) { dirtyTabs.delete(tab); renderAtivo(); }
}

function renderAtivo() {
  if (abaAtiva==='dashboard')    renderDashboard();
  if (abaAtiva==='planejamento') renderPlanejamento();
  if (abaAtiva==='pagar')        renderPagar();
  if (abaAtiva==='gastos')       renderGastos();
  if (abaAtiva==='faturas')      renderFaturas();
  if (abaAtiva==='perfil')       renderPerfil();
}

function navMes(delta) {
  mesAtual += delta;
  if (mesAtual>12) { mesAtual=1;  anoAtual++; }
  if (mesAtual<1)  { mesAtual=12; anoAtual--; }
  filtroGastosCat = null;
  loadMes();
}

async function recarregar() { await loadAll(); showToast('Dados atualizados ✓','success'); }

async function retentarUltimaAcao() {
  if (!ultimaAcaoParams) return;
  document.getElementById('toast-retry').style.display = 'none';
  const p = ultimaAcaoParams; ultimaAcaoParams = null;
  try { await p.fn(); } catch(e) { showToast('Falhou novamente: '+e.message,'error'); }
}

document.addEventListener('DOMContentLoaded', () => { loadAll(); });
</script>
</body>
