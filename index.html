<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Orçamento Ivan v2</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a; color: #f0f0f0; font-size: 15px;
      min-height: 100vh; max-width: 480px; margin: 0 auto;
      padding-bottom: 80px;
    }
    input, select, textarea { font-size: 16px !important; }

    /* Header */
    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px 10px; background: #0a0a0a;
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid #1a1a1a;
    }
    .app-title { font-size: 17px; font-weight: 700; color: #fff; }
    .app-title span { color: #6366f1; }
    .mes-nav { display: flex; align-items: center; gap: 2px; }
    .mes-nav-btn {
      background: none; border: none; color: #555; font-size: 22px;
      cursor: pointer; min-height: 44px; min-width: 36px;
      display: flex; align-items: center; justify-content: center;
    }
    .mes-nav-btn:hover { color: #aaa; }
    .mes-nav-label { font-size: 13px; font-weight: 600; color: #e0e0e0; white-space: nowrap; }
    .btn-icon {
      background: none; border: none; color: #555; font-size: 18px;
      cursor: pointer; min-height: 44px; min-width: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
    }
    .btn-icon:hover { color: #aaa; background: #1a1a1a; }

    /* Content */
    .content { padding: 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: #111; border-top: 1px solid #1e1e1e;
      display: flex; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 10px 0 8px; border: none; background: transparent;
      color: #555; font-size: 10px; gap: 3px; cursor: pointer;
      transition: color 0.15s; min-height: 58px;
    }
    .nav-item.active { color: #6366f1; }
    .nav-icon { font-size: 20px; line-height: 1; }

    /* Toast */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(200px);
      background: #1e1e1e; border: 1px solid #333; color: #f0f0f0;
      border-radius: 24px; padding: 10px 18px; font-size: 13px;
      display: flex; align-items: center; gap: 10px;
      transition: transform 0.3s ease; z-index: 200; white-space: nowrap;
      max-width: calc(100vw - 32px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: #2a0a0a; border-color: #5a1a1a; color: #f87171; }
    .toast.success { background: #0a2a0a; border-color: #1a5a1a; color: #4ade80; }
    .btn-retry {
      background: rgba(255,255,255,0.15); border: none; border-radius: 14px;
      color: #fff; font-size: 11px; font-weight: 600; padding: 3px 10px; cursor: pointer;
    }

    /* Loading */
    .loading { display: flex; align-items: center; gap: 10px; padding: 32px 0; color: #555; font-size: 13px; }
    .spinner { width: 20px; height: 20px; border: 2px solid #333; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; padding: 40px 0; color: #444; font-size: 13px; }
    .empty-state .icon { font-size: 32px; margin-bottom: 10px; }

    .sec-title {
      font-size: 11px; font-weight: 700; color: #555;
      text-transform: uppercase; letter-spacing: 0.08em; margin: 20px 0 10px;
    }
    .secao-divider {
      font-size: 10px; font-weight: 700; color: #444; text-transform: uppercase;
      letter-spacing: 0.1em; padding: 10px 0 4px; display: flex; align-items: center; gap: 8px;
    }
    .secao-divider::after { content: ''; flex: 1; height: 1px; background: #1e1e1e; }

    .progress-bar { background: #222; border-radius: 99px; height: 6px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; background: #4ade80; }
    .progress-fill.amber { background: #fbbf24; }
    .progress-fill.red   { background: #f87171; }

    /* Dashboard */
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .kpi-card {
      background: #141414; border: 1px solid #1e1e1e; border-radius: 14px; padding: 16px;
    }
    .kpi-card.highlight { border-color: #6366f1; background: #0d0d1a; margin-bottom: 20px; }
    .kpi-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .kpi-value { font-size: 22px; font-weight: 700; color: #fff; }
    .kpi-value.green { color: #4ade80; }
    .kpi-value.red   { color: #f87171; }
    .kpi-sub { font-size: 11px; color: #555; margin-top: 4px; }

    .pace-card {
      background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; padding: 14px; margin-bottom: 8px;
    }
    .pace-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .pace-name { font-size: 14px; font-weight: 500; color: #e0e0e0; }
    .pace-badge { font-size: 12px; font-weight: 600; }
    .pace-badge.ok   { color: #4ade80; }
    .pace-badge.warn { color: #fbbf24; }
    .pace-badge.over { color: #f87171; }
    .pace-amounts { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 6px; }

    .top-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .top-rank { font-size: 12px; color: #444; width: 16px; flex-shrink: 0; }
    .top-name { font-size: 13px; color: #ccc; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-bar-wrap { width: 80px; background: #1a1a1a; border-radius: 4px; height: 6px; flex-shrink: 0; }
    .top-bar { height: 6px; border-radius: 4px; background: #6366f1; }
    .top-val { font-size: 13px; color: #888; white-space: nowrap; }

    .alert-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #1f0a0a; border: 1px solid #3a1414;
      border-radius: 10px; margin-bottom: 6px; font-size: 13px;
    }
    .alert-item .name { color: #fca5a5; }
    .alert-item .val  { color: #f87171; font-weight: 600; }

    /* Contas */
    .contas-top-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .contas-top-title { font-size: 16px; font-weight: 700; color: #fff; }
    .btn-nova {
      background: #6366f1; border: none; color: #fff; border-radius: 10px;
      padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 44px;
    }
    .contas-summary {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
    }
    .cs-card {
      background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; padding: 14px;
    }
    .cs-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .cs-val { font-size: 19px; font-weight: 700; }
    .cs-val.red   { color: #f87171; }
    .cs-val.green { color: #4ade80; }

    .conta-card {
      background: #141414; border: 1px solid #1e1e1e; border-radius: 14px;
      padding: 16px; margin-bottom: 10px; position: relative;
    }
    .conta-card.overdue { border-color: #3a1414; }
    .conta-card.today   { border-color: #3a2a08; }
    .conta-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .conta-left { flex: 1; min-width: 0; padding-right: 40px; }
    .conta-name { font-size: 15px; font-weight: 600; color: #e0e0e0; }
    .conta-meta { font-size: 12px; color: #555; margin-top: 3px; }
    .conta-right { text-align: right; flex-shrink: 0; }
    .conta-val  { font-size: 17px; font-weight: 700; color: #fff; }
    .conta-paid { font-size: 11px; color: #4ade80; margin-top: 2px; }
    .conta-rem  { font-size: 12px; color: #f87171; margin-top: 2px; }

    .badge {
      display: inline-flex; align-items: center; font-size: 11px; font-weight: 600;
      padding: 3px 9px; border-radius: 99px; margin-top: 8px;
    }
    .badge-pago    { background: #0a2a0a; color: #4ade80; }
    .badge-parcial { background: #0a1a2a; color: #60a5fa; }
    .badge-vencido { background: #2a0a0a; color: #f87171; }
    .badge-hoje    { background: #2a1a00; color: #fbbf24; }
    .badge-semana  { background: #1a1a00; color: #fcd34d; }
    .badge-futuro  { background: #111; color: #555; }
    .badge-fatura  { background: #1a0a2a; color: #c084fc; }
    .badge-auto    { background: #1a0a2a; color: #c084fc; }
    .badge-manual  { background: #2a1a00; color: #fbbf24; }

    /* Toggle de recorrência */
    .rec-toggle { display: flex; gap: 7px; margin-bottom: 14px; }
    .rec-opt {
      flex: 1; padding: 10px 6px; background: #1a1a1a; border: 2px solid #2a2a2a;
      border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.15s;
    }
    .rec-opt-icon { font-size: 18px; display: block; margin-bottom: 3px; }
    .rec-opt-label { font-size: 11px; font-weight: 600; color: #666; display: block; }
    .rec-opt-hint { font-size: 9px; color: #444; display: block; margin-top: 2px; }
    .rec-opt.sel-auto  { border-color: #c084fc; background: #1a0a2a; }
    .rec-opt.sel-auto .rec-opt-label  { color: #c084fc; }
    .rec-opt.sel-manual { border-color: #fbbf24; background: #2a1a00; }
    .rec-opt.sel-manual .rec-opt-label { color: #fbbf24; }
    .rec-opt.sel-pontual { border-color: #6366f1; background: #0d0d1a; }
    .rec-opt.sel-pontual .rec-opt-label { color: #818cf8; }

    /* Planejamento */
    .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .plan-title  { font-size: 16px; font-weight: 700; color: #fff; }
    .plan-total  { font-size: 13px; color: #f87171; font-weight: 600; }
    .plan-card {
      background: #141414; border: 1px solid #1e1e1e; border-radius: 12px;
      padding: 13px 14px; margin-bottom: 7px;
      display: flex; align-items: center; gap: 10px;
    }
    .plan-emoji { font-size: 20px; flex-shrink: 0; }
    .plan-info  { flex: 1; min-width: 0; }
    .plan-name  { font-size: 14px; font-weight: 600; color: #e0e0e0; }
    .plan-meta  { font-size: 11px; color: #555; margin-top: 2px; }
    .plan-right { text-align: right; flex-shrink: 0; }
    .plan-val   { font-size: 14px; font-weight: 700; color: #f0f0f0; }
    .plan-day   { font-size: 11px; color: #444; margin-top: 2px; }

    .conta-prog { margin-top: 10px; }
    .conta-prog .progress-bar { height: 5px; }

    .menu-btn {
      position: absolute; top: 12px; right: 12px;
      background: none; border: none; color: #444; cursor: pointer;
      font-size: 18px; padding: 4px 6px; min-height: 32px; border-radius: 6px; line-height: 1;
    }
    .menu-btn:hover { color: #888; background: #1e1e1e; }
    .menu-popup {
      position: absolute; top: 42px; right: 12px;
      background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 10px;
      padding: 4px; z-index: 20; min-width: 140px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: none;
    }
    .menu-popup.open { display: block; }
    .menu-item {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border-radius: 7px; cursor: pointer; font-size: 13px;
      border: none; background: none; color: #ccc; width: 100%; text-align: left;
    }
    .menu-item:hover { background: #2a2a2a; }
    .menu-item.danger { color: #f87171; }

    .btn-pay-full {
      width: 100%; background: #6366f1; border: none; color: #fff;
      border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 12px; min-height: 48px;
    }
    .btn-pay-full:hover { background: #4f46e5; }
    .btn-pay-full.paid-btn { background: #141414; border: 1px solid #1e1e1e; color: #4ade80; cursor: default; }

    /* Faturas */
    .fatura-card {
      background: #141414; border: 1px solid #1e1e1e; border-radius: 14px;
      padding: 16px; margin-bottom: 12px;
    }
    .fatura-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .fatura-card-name { font-size: 15px; font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }
    .fatura-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .fatura-total { font-size: 20px; font-weight: 700; color: #fff; }
    .fatura-sub { font-size: 12px; color: #555; margin-bottom: 10px; }
    .fatura-cat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-top: 1px solid #1e1e1e; }
    .fatura-cat-name { color: #888; }
    .fatura-cat-val  { color: #ccc; font-weight: 500; }
    .btn-gen-fatura {
      width: 100%; background: #1a1a2a; border: 1px solid #2a2a3a;
      color: #818cf8; border-radius: 10px; padding: 12px; font-size: 13px;
      cursor: pointer; margin-top: 10px; min-height: 44px;
    }
    .btn-gen-fatura:hover { background: #222; }

    /* Gastos */
    .gastos-form {
      background: #141414; border: 1px solid #1e1e1e; border-radius: 14px;
      padding: 16px; margin-bottom: 18px;
    }
    .gastos-form-title { font-size: 12px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field input, .field select, .field textarea {
      width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 10px; padding: 12px 14px; color: #f0f0f0;
      font-size: 16px; outline: none; transition: border-color 0.15s; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #6366f1; }
    .field select option { background: #1a1a1a; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; margin-bottom: 0; }
    .btn-primary {
      width: 100%; background: #6366f1; border: none; color: #fff;
      border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 600;
      cursor: pointer; min-height: 48px; transition: background 0.15s;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-registrar {
      width: 100%; background: #22c55e; border: none; color: #fff;
      border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 600;
      cursor: pointer; min-height: 48px; margin-top: 4px;
    }
    .btn-registrar:hover { background: #16a34a; }

    .gastos-resumo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .gr-card { background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; padding: 14px; text-align: center; }
    .gr-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .gr-val { font-size: 19px; font-weight: 700; color: #f0f0f0; }
    .gr-val.red { color: #f87171; }

    .gastos-group-day { margin-bottom: 14px; }
    .gastos-day-label { font-size: 11px; color: #444; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .gasto-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; background: #141414; border: 1px solid #1e1e1e;
      border-radius: 12px; margin-bottom: 6px;
    }
    .gasto-emoji { font-size: 20px; flex-shrink: 0; }
    .gasto-info { flex: 1; min-width: 0; }
    .gasto-desc { font-size: 14px; color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gasto-meta { font-size: 12px; color: #555; margin-top: 2px; }
    .gasto-valor { font-size: 14px; font-weight: 600; color: #f0f0f0; white-space: nowrap; }
    .gasto-del {
      background: none; border: none; color: #333; cursor: pointer; font-size: 16px;
      padding: 4px 6px; border-radius: 6px; min-height: 44px; min-width: 36px;
      display: flex; align-items: center; justify-content: center;
    }
    .gasto-del:hover { color: #f87171; background: #1a1a1a; }

    /* Perfil */
    .perfil-avatar {
      width: 64px; height: 64px; background: #1e1e2e; border: 2px solid #6366f1;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 20px;
    }
    .perfil-section { margin-bottom: 24px; }
    .perfil-section-title {
      font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid #1e1e1e;
      display: flex; justify-content: space-between; align-items: center;
    }
    .card-item {
      display: flex; align-items: center; padding: 14px;
      background: #141414; border: 1px solid #1e1e1e; border-radius: 12px; margin-bottom: 8px;
    }
    .card-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-right: 12px; }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-size: 14px; font-weight: 600; color: #e0e0e0; }
    .card-meta { font-size: 12px; color: #555; margin-top: 2px; }
    .card-actions { display: flex; gap: 4px; }
    .btn-card-act {
      background: none; border: 1px solid #2a2a2a; color: #666; border-radius: 8px;
      padding: 6px 10px; font-size: 13px; cursor: pointer; min-height: 36px;
    }
    .btn-card-act:hover { border-color: #6366f1; color: #818cf8; }
    .btn-card-del:hover { border-color: #ef4444 !important; color: #ef4444 !important; }
    .btn-add-card {
      width: 100%; background: transparent; border: 1px dashed #2a2a2a; color: #555;
      border-radius: 12px; padding: 14px; font-size: 13px; cursor: pointer;
      margin-top: 6px; min-height: 48px;
    }
    .btn-add-card:hover { border-color: #6366f1; color: #818cf8; }
    .cat-item {
      display: flex; align-items: center; gap: 10px; padding: 12px 0;
      border-bottom: 1px solid #1a1a1a;
    }
    .cat-emoji { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
    .cat-name { flex: 1; font-size: 14px; font-weight: 500; color: #e0e0e0; }
    .cat-actions { display: flex; gap: 6px; }
    .emoji-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .emoji-opt { font-size: 20px; cursor: pointer; padding: 4px; border-radius: 6px; border: 1px solid transparent; }
    .emoji-opt:hover { border-color: #6366f1; background: #1e1e2e; }
    .emoji-opt.sel { border-color: #6366f1; background: #1e1e2e; }
    .perfil-renda {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
    }
    .perfil-renda input { flex: 1; }

    /* Modal (bottom sheet) */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 150;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: #141414; border: 1px solid #2a2a2a;
      border-radius: 20px 20px 0 0; padding: 8px 20px 32px;
      width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
    }
    .modal-handle { width: 40px; height: 4px; background: #333; border-radius: 99px; margin: 12px auto 20px; }
    .modal-title { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
    .btn-cancel {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #888;
      border-radius: 10px; padding: 14px; font-size: 14px; cursor: pointer; min-height: 48px;
    }
    .btn-save {
      flex: 2; background: #6366f1; border: none; color: #fff;
      border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 48px;
    }
    .btn-save:hover { background: #4f46e5; }

    /* Payment method grid */
    .method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .method-opt {
      padding: 12px 8px; background: #1a1a1a; border: 2px solid #2a2a2a;
      border-radius: 10px; text-align: center; font-size: 12px; color: #888;
      cursor: pointer; transition: all 0.15s;
    }
    .method-opt:hover { border-color: #444; }
    .method-opt.selected { border-color: #6366f1; color: #818cf8; background: #1a1a2a; }
    .method-opt-icon { font-size: 22px; margin-bottom: 4px; }

    .aviso {
      background: #1a0a0a; border: 1px solid #3a1a1a; color: #f87171;
      border-radius: 10px; padding: 10px 14px; font-size: 12px; line-height: 1.5; margin-bottom: 14px;
    }
    #aviso-global { padding: 0 16px; }
  </style>
</head>
<body>

<div id="aviso-global"></div>

<header class="app-header">
  <div class="app-title">Orçamento <span>Ivan</span></div>
  <div class="mes-nav">
    <button class="mes-nav-btn" onclick="navMes(-1)">‹</button>
    <span class="mes-nav-label" id="mes-label">Carregando...</span>
    <button class="mes-nav-btn" onclick="navMes(+1)">›</button>
  </div>
  <button class="btn-icon" onclick="recarregar()" id="btn-refresh">↻</button>
</header>

<div class="content">
  <div id="tab-dashboard" class="tab-content active">
    <div id="dash-root"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
  </div>
  <div id="tab-planejamento" class="tab-content">
    <div id="planejamento-root"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
  </div>
  <div id="tab-pagar" class="tab-content">
    <div id="pagar-root"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
  </div>
  <div id="tab-gastos" class="tab-content">
    <div id="gastos-root"></div>
  </div>
  <div id="tab-perfil" class="tab-content">
    <div id="perfil-root"></div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
    <span class="nav-icon">📊</span><span>Dashboard</span>
  </button>
  <button class="nav-item" data-tab="planejamento" onclick="switchTab('planejamento')">
    <span class="nav-icon">📋</span><span>Planej.</span>
  </button>
  <button class="nav-item" data-tab="pagar" onclick="switchTab('pagar')">
    <span class="nav-icon">💳</span><span>Pagar</span>
  </button>
  <button class="nav-item" data-tab="gastos" onclick="switchTab('gastos')">
    <span class="nav-icon">💸</span><span>Gastos</span>
  </button>
  <button class="nav-item" data-tab="perfil" onclick="switchTab('perfil')">
    <span class="nav-icon">👤</span><span>Perfil</span>
  </button>
</nav>

<div class="modal-overlay hidden" id="modal-overlay" onclick="fecharModal(event)">
  <div class="modal" id="modal-content" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toast-msg"></span>
  <button class="btn-retry" id="toast-retry" style="display:none" onclick="retentarUltimaAcao()">Tentar de novo</button>
</div>

<script>
const SUPABASE_URL  = 'https://mzwynanvhojzyoirvxkc.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16d3luYW52aG9qenlvaXJ2eGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mjc3NjEsImV4cCI6MjEwMTUwMzc2MX0.UniVWAVDJgyHo8QGlqXjMeTBulsjEDdZ5nyBWowYO2s';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

let mesAtual        = new Date().getMonth() + 1;
let anoAtual        = new Date().getFullYear();
let abaAtiva        = 'dashboard';
let dirtyTabs       = new Set();
let categories      = [];
let paymentMethods  = [];
let commitments     = [];
let spendingEntries = [];
let spendingSummary = [];
let cashflow        = null;
let categoryBudgets = [];
let ultimaAcaoParams = null;

const fmt  = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtK = v => { const n = Number(v)||0; return n>=1000 ? `R$ ${(n/1000).toFixed(1)}k` : `R$ ${fmt(n)}`; };
const esc  = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function showToast(msg, type='', showRetry=false) {
  document.getElementById('toast-msg').textContent = msg;
  const t = document.getElementById('toast');
  t.className = 'toast show' + (type ? ' '+type : '');
  document.getElementById('toast-retry').style.display = (showRetry && ultimaAcaoParams) ? 'inline-block' : 'none';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { t.className = 'toast'; }, 4000);
}

function avisar(html, tipo) {
  document.getElementById('aviso-global').innerHTML = html ? `<div class="aviso ${tipo||''}">${html}</div>` : '';
}

function mesLabel(m, y) { return `${MESES[m-1]} ${y}`; }

function statusConta(item, venc) {
  const pct = item.planned_amount > 0 ? (item.paid / item.planned_amount) : 0;
  if (pct >= 0.9995) return 'pago';
  if (item.paid > 0) return 'parcial';
  if (item.type === 'fatura') return 'fatura';
  if (!venc) return 'futuro';
  const hoje = new Date().getDate();
  if (venc < hoje) return 'vencido';
  if (venc === hoje) return 'hoje';
  if (venc - hoje <= 3) return 'semana';
  return 'futuro';
}

function prioridadeConta(item) {
  const s = statusConta(item, item.due_day);
  if (s === 'vencido') return item.paid > 0 ? 1 : 0;
  if (s === 'hoje')    return 2;
  if (s === 'semana')  return 3;
  if (s === 'fatura' || s === 'futuro') return 4;
  if (s === 'parcial') return 5;
  if (s === 'pago')    return 6;
  return 7;
}

function getLimitForCategory(catId) {
  const s = categoryBudgets.find(b => b.category_id===catId && b.month===mesAtual && b.year===anoAtual);
  if (s) return s.limit_amount;
  const t = categoryBudgets.find(b => b.category_id===catId && !b.month);
  return t ? t.limit_amount : null;
}

// === SUPABASE ===
async function loadAll() {
  document.getElementById('btn-refresh').disabled = true;
  try {
    const [cats, pms, budgets] = await Promise.all([
      sb.from('fin_categories').select('*').order('sort_order'),
      sb.from('fin_payment_methods').select('*').order('sort_order'),
      sb.from('fin_category_budgets').select('*')
    ]);
    categories      = cats.data    || [];
    paymentMethods  = pms.data     || [];
    categoryBudgets = budgets.data || [];
    await loadMes();
  } catch(e) {
    avisar('Erro ao conectar ao banco de dados.', '');
  } finally {
    document.getElementById('btn-refresh').disabled = false;
  }
}

async function loadMes() {
  document.getElementById('mes-label').textContent = mesLabel(mesAtual, anoAtual);
  dirtyTabs = new Set(['dashboard','planejamento','pagar','gastos']);

  const [cmts, spend, spSum] = await Promise.all([
    sb.from('fin_commitment_summary').select('*').eq('month', mesAtual).eq('year', anoAtual).order('due_day'),
    sb.from('fin_spending_entries').select('*').eq('month', mesAtual).eq('year', anoAtual).order('spend_date', {ascending:false}),
    sb.from('fin_spending_summary').select('*').eq('month', mesAtual).eq('year', anoAtual)
  ]);

  commitments     = cmts.data  || [];
  spendingEntries = spend.data || [];
  spendingSummary = spSum.data || [];

  const { data: rawCmts } = await sb.from('fin_commitments')
    .select('id, default_payment_method_id, recurrence_type')
    .eq('month', mesAtual).eq('year', anoAtual);
  const pmMap  = Object.fromEntries((rawCmts||[]).map(r => [r.id, r.default_payment_method_id]));
  const recMap = Object.fromEntries((rawCmts||[]).map(r => [r.id, r.recurrence_type]));
  commitments.forEach(c => {
    c.default_payment_method_id = pmMap[c.id] || null;
    c.recurrence_type = recMap[c.id] || 'manual';
  });

  const { data: cf } = await sb.rpc('fin_monthly_cashflow', { p_month: mesAtual, p_year: anoAtual });
  cashflow = (cf && cf[0]) || null;

  renderAtivo();
  dirtyTabs.delete(abaAtiva);
}

async function insertSpending(catId, cardId, amount, description, date) {
  const m = parseInt(date.slice(5,7)), y = parseInt(date.slice(0,4));
  const { data, error } = await sb.from('fin_spending_entries').insert({
    month: m, year: y, category_id: catId, payment_method_id: cardId,
    amount: Number(amount), description, spend_date: date
  }).select().single();
  if (error) throw error;
  return data;
}

async function insertCommitment(payload) {
  const { data, error } = await sb.from('fin_commitments').insert(payload).select().single();
  if (error) throw error;
  return data;
}

async function insertPayment(commitmentId, amount, methodId, note, date) {
  const { data, error } = await sb.from('fin_commitment_payments').insert({
    commitment_id: commitmentId,
    amount: Number(amount),
    payment_method_id: methodId || null,
    note: note || null,
    payment_date: date || new Date().toISOString().slice(0,10)
  }).select().single();
  if (error) throw error;
  return data;
}

// === DASHBOARD ===
function renderDashboard() {
  const el = document.getElementById('dash-root');
  if (!cashflow) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📊</div>Nenhum dado para este mês</div>';
    return;
  }
  const cf = cashflow;
  const sobra = Number(cf.surplus_expected);
  const sobraClass = sobra >= 0 ? 'green' : 'red';

  const spendByCat = {};
  spendingSummary.forEach(s => {
    if (!spendByCat[s.category_name])
      spendByCat[s.category_name] = { spent: 0, catId: s.category_id, emoji: s.category_emoji };
    spendByCat[s.category_name].spent += Number(s.total_spent);
  });

  const catsWithBudget = categories.filter(c => getLimitForCategory(c.id) !== null);
  const paceHtml = catsWithBudget.map(cat => {
    const lim   = getLimitForCategory(cat.id);
    const spent = (spendByCat[cat.name] || {spent:0}).spent;
    const pct   = lim > 0 ? Math.min((spent/lim)*100, 120) : 0;
    const barPct = Math.min(pct, 100);
    const barClass   = pct>=100 ? 'red' : pct>=80 ? 'amber' : '';
    const badgeClass = pct>=100 ? 'over' : pct>=80 ? 'warn' : 'ok';
    const badgeText  = pct>=100 ? `⚠ +R$${fmt(spent-lim)}` : `${pct.toFixed(0)}%`;
    return `
      <div class="pace-card">
        <div class="pace-header">
          <div class="pace-name">${esc(cat.emoji||'•')} ${esc(cat.name)}</div>
          <div class="pace-badge ${badgeClass}">${badgeText}</div>
        </div>
        <div class="pace-amounts"><span>R$ ${fmt(spent)}</span><span>Teto: R$ ${fmt(lim)}</span></div>
        <div class="progress-bar"><div class="progress-fill ${barClass}" style="width:${barPct}%"></div></div>
      </div>`;
  }).join('');

  const sorted = Object.entries(spendByCat).sort((a,b) => b[1].spent - a[1].spent).slice(0,5);
  const maxSpent = sorted.length ? sorted[0][1].spent : 1;
  const topHtml = sorted.map(([name, d], i) => `
    <div class="top-row">
      <div class="top-rank">${i+1}</div>
      <div class="top-name">${esc(d.emoji||'•')} ${esc(name)}</div>
      <div class="top-bar-wrap"><div class="top-bar" style="width:${Math.round(d.spent/maxSpent*100)}%"></div></div>
      <div class="top-val">R$${fmt(d.spent)}</div>
    </div>`).join('');

  const overBudget = Object.entries(spendByCat).filter(([n,d]) => {
    const lim = getLimitForCategory(d.catId);
    return lim && d.spent > lim;
  });

  el.innerHTML = `
    ${overBudget.length > 0 ? `
      <div class="sec-title">⚠ Acima do teto</div>
      ${overBudget.map(([n,d]) => {
        const lim = getLimitForCategory(d.catId);
        return `<div class="alert-item"><span class="name">${esc(d.emoji||'•')} ${esc(n)}</span><span class="val">+R$ ${fmt(d.spent-lim)}</span></div>`;
      }).join('')}` : ''}

    <div class="sec-title">Resumo do mês</div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Disponível</div>
        <div class="kpi-value" style="font-size:20px">R$ ${fmt(cf.income_received)}</div>
        <div class="kpi-sub">Previsto: R$ ${fmt(cf.income_expected)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Comprometido</div>
        <div class="kpi-value" style="font-size:20px">${fmtK(cf.commitments_total)}</div>
        <div class="kpi-sub">Pago: R$ ${fmt(cf.commitments_paid)}</div>
      </div>
    </div>
    <div class="kpi-card highlight">
      <div class="kpi-label">Sobra prevista</div>
      <div class="kpi-value ${sobraClass}">R$ ${fmt(sobra)}</div>
      <div class="kpi-sub">Real até agora: R$ ${fmt(cf.surplus_actual)}</div>
    </div>

    ${catsWithBudget.length > 0 ? `<div class="sec-title">Pace por categoria</div>${paceHtml}` : ''}
    ${sorted.length > 0 ? `<div class="sec-title">Top gastos do mês</div>${topHtml}` : ''}
  `;
}

// === PLANEJAMENTO ===
function renderPlanejamento() {
  const el = document.getElementById('planejamento-root');
  const totalComprometido = commitments.reduce((s,c) => s + Number(c.planned_amount), 0);

  const automaticas = commitments.filter(c => c.recurrence_type === 'automatico').sort((a,b) => (a.due_day||99)-(b.due_day||99));
  const manuais     = commitments.filter(c => c.recurrence_type === 'manual').sort((a,b) => (a.due_day||99)-(b.due_day||99));
  const pontuais    = commitments.filter(c => c.recurrence_type === 'pontual').sort((a,b) => (a.due_day||99)-(b.due_day||99));

  function buildPlanCard(c) {
    const cat   = categories.find(x => x.id === c.category_id);
    const emoji = cat?.emoji || '📌';
    const badge = c.recurrence_type === 'automatico'
      ? `<span class="badge badge-auto">🤖 Automático</span>`
      : c.recurrence_type === 'pontual'
        ? `<span class="badge badge-futuro">📅 Pontual</span>`
        : `<span class="badge badge-manual">🔔 Manual</span>`;
    const dayLabel = c.due_day ? `Dia ${c.due_day}` : 'Sem vencimento';
    return `
      <div class="plan-card">
        <div class="plan-emoji">${esc(emoji)}</div>
        <div class="plan-info">
          <div class="plan-name">${esc(c.name)}</div>
          <div class="plan-meta">${esc(c.category_name||'')}${c.category_name?' · ':''}${dayLabel}</div>
          ${badge}
        </div>
        <div class="plan-right">
          <div class="plan-val">R$ ${fmt(c.planned_amount)}</div>
          <button class="menu-btn" style="position:static;margin-left:4px" onclick="abrirEditarCommitment('${esc(c.id)}')">✏️</button>
        </div>
      </div>`;
  }

  const autoHtml    = automaticas.map(buildPlanCard).join('');
  const manualHtml  = manuais.map(buildPlanCard).join('');
  const pontualHtml = pontuais.map(buildPlanCard).join('');

  el.innerHTML = `
    <div class="plan-header">
      <div class="plan-title">Planejamento</div>
      <button class="btn-nova" onclick="abrirModalNovaConta()">+ Nova</button>
    </div>
    <div class="contas-summary">
      <div class="cs-card"><div class="cs-label">Comprometido</div><div class="cs-val red">R$ ${fmt(totalComprometido)}</div></div>
      <div class="cs-card"><div class="cs-label">Itens</div><div class="cs-val green">${commitments.length}</div></div>
    </div>

    ${automaticas.length ? `<div class="secao-divider">🤖 Automáticos — cobram sozinhos</div>${autoHtml}` : ''}
    ${manuais.length     ? `<div class="secao-divider">🔔 Manuais — precisa pagar</div>${manualHtml}` : ''}
    ${pontuais.length    ? `<div class="secao-divider">📅 Pontuais — só este mês</div>${pontualHtml}` : ''}

    ${!commitments.length ? '<div class="empty-state"><div class="icon">📋</div>Nenhuma despesa cadastrada<br><small style="margin-top:8px;display:block">Toque em + Nova para começar</small></div>' : ''}
  `;
}

function buildContaCard(c) {
  const venc   = c.due_day;
  const status = statusConta(c, venc);
  const paid   = Number(c.paid);
  const rem    = Number(c.remaining);
  const plan   = Number(c.planned_amount);
  const pct    = plan > 0 ? Math.min((paid/plan)*100, 100) : 0;
  const barClass = pct>=100 ? 'green' : pct>=50 ? 'amber' : '';
  const isPaid = status === 'pago';
  const isOverdue = status === 'vencido';
  const isToday   = status === 'hoje';

  const defPm     = c.default_payment_method_id ? paymentMethods.find(p => p.id===c.default_payment_method_id) : null;
  const defPmBadge = defPm ? `<span class="badge badge-fatura" style="margin-left:6px">💳 ${esc(defPm.name)}</span>` : '';

  const badgeMap = {
    pago:    `<span class="badge badge-pago">✓ Pago</span>`,
    parcial: `<span class="badge badge-parcial">Parcial</span>`,
    vencido: `<span class="badge badge-vencido">Vencido</span>`,
    hoje:    `<span class="badge badge-hoje">Vence hoje</span>`,
    semana:  `<span class="badge badge-semana">Em breve</span>`,
    futuro:  `<span class="badge badge-futuro">Dia ${venc||'?'}</span>`,
    fatura:  `<span class="badge badge-fatura">💳 Fatura</span>`
  };

  const payBtn = isPaid
    ? `<div class="btn-pay-full paid-btn">✓ Pago</div>`
    : `<button class="btn-pay-full" onclick="abrirPagamentoModal('${esc(c.id)}')">
        ${paid > 0 ? '+ Adicionar pagamento' : 'Registrar pagamento'}
       </button>`;

  return `
    <div class="conta-card ${isOverdue?'overdue':''} ${isToday?'today':''}">
      <button class="menu-btn" onclick="toggleMenu('${esc(c.id)}')">⋯</button>
      <div class="menu-popup" id="menu-${esc(c.id)}">
        <button class="menu-item" onclick="abrirEditarCommitment('${esc(c.id)}');fecharMenus()">✏️ Editar</button>
        <button class="menu-item danger" onclick="deletarCommitment('${esc(c.id)}','${esc(c.name)}');fecharMenus()">🗑️ Excluir</button>
      </div>
      <div class="conta-top">
        <div class="conta-left">
          <div class="conta-name">${esc(c.name)}</div>
          <div class="conta-meta">${c.category_name ? esc(c.category_emoji||'')+ ' ' +esc(c.category_name) : ''}${c.due_day?' · Dia '+c.due_day:''}${c.type==='parcelado'&&c.installment_current?` · ${c.installment_current}/${c.installment_total}`:''}</div>
          ${badgeMap[status]||''}${defPmBadge}
        </div>
        <div class="conta-right">
          <div class="conta-val">R$ ${fmt(plan)}</div>
          ${paid>0&&!isPaid?`<div class="conta-paid">Pago: R$ ${fmt(paid)}</div>`:''}
          ${rem>0.005?`<div class="conta-rem">Falta: R$ ${fmt(rem)}</div>`:''}
        </div>
      </div>
      ${pct>0&&!isPaid?`<div class="conta-prog"><div class="progress-bar"><div class="progress-fill ${barClass}" style="width:${pct}%"></div></div></div>`:''}
      ${payBtn}
    </div>`;
}

function toggleMenu(id) {
  const m = document.getElementById(`menu-${id}`);
  if (!m) return;
  const open = m.classList.contains('open');
  fecharMenus();
  if (!open) m.classList.add('open');
}
function fecharMenus() {
  document.querySelectorAll('.menu-popup.open').forEach(m => m.classList.remove('open'));
}
document.addEventListener('click', e => {
  if (!e.target.closest('.menu-btn') && !e.target.closest('.menu-popup')) fecharMenus();
});

function abrirPagamentoModal(id) {
  const c = commitments.find(x => x.id===id);
  if (!c) return;
  const rem  = Number(c.remaining);
  const plan = Number(c.planned_amount);
  const sugestao = (rem > 0.005 ? rem : plan).toFixed(2);

  const pmOpts = paymentMethods.filter(p => p.active !== false).map(p => {
    const icon = p.type==='credito'?'💳':p.type==='debito'?'🏦':p.type==='pix'?'📱':'💵';
    return `<div class="method-opt" data-pm-id="${esc(p.id)}" data-pm-type="${esc(p.type)}" onclick="selecionarMetodo('${esc(p.id)}')">
      <div class="method-opt-icon">${icon}</div>
      <div>${esc(p.name)}</div>
    </div>`;
  }).join('');

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">Registrar pagamento</div>
    <div style="font-size:14px;color:#888;margin-bottom:16px">${esc(c.name)}</div>
    <div class="field">
      <label>Valor (R$)</label>
      <input type="number" id="pay-val" value="${sugestao}" step="0.01" min="0.01" inputmode="decimal" />
    </div>
    <div style="font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Método de pagamento</div>
    <div class="method-grid">${pmOpts || '<div style="color:#555;font-size:13px;padding:8px">Nenhum método cadastrado</div>'}</div>
    <div id="credit-note" style="display:none;background:#1a1a2a;border:1px solid #2a2a3a;border-radius:10px;padding:10px 14px;font-size:12px;color:#818cf8;margin-bottom:12px">
      💳 Lançado na fatura do cartão (próximo mês).
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="confirmarPagamento('${esc(id)}')">Confirmar</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
  setTimeout(() => {
    document.getElementById('pay-val')?.focus();
    if (c.default_payment_method_id) selecionarMetodo(c.default_payment_method_id);
  }, 100);
}

function selecionarMetodo(pmId) {
  document.querySelectorAll('.method-opt').forEach(el => el.classList.remove('selected'));
  const el = document.querySelector(`.method-opt[data-pm-id="${pmId}"]`);
  if (el) el.classList.add('selected');
  const note = document.getElementById('credit-note');
  if (note) note.style.display = (el?.dataset.pmType === 'credito') ? 'block' : 'none';
}

async function confirmarPagamento(id) {
  const c   = commitments.find(x => x.id===id);
  const val = parseFloat(document.getElementById('pay-val')?.value);
  if (!c || !val || val <= 0) { showToast('Informe um valor válido','error'); return; }

  const sel    = document.querySelector('.method-opt.selected');
  const pmId   = sel?.dataset.pmId   || null;
  const pmType = sel?.dataset.pmType || null;

  fecharModal();

  const prevPaid  = Number(c.paid);
  c.paid          = prevPaid + val;
  c.remaining     = Number(c.planned_amount) - c.paid;
  renderPagar();
  dirtyTabs.add('dashboard');
  dirtyTabs.add('pagar');

  try {
    await insertPayment(id, val, pmId, null, null);
    if (pmType === 'credito' && pmId) {
      const hoje = new Date().toISOString().slice(0,10);
      await insertSpending(c.category_id || null, pmId, val, c.name, hoje);
    }
    await loadMes();
    showToast(`Pagamento de R$ ${fmt(val)} registrado ✓`, 'success');
  } catch(e) {
    c.paid      = prevPaid;
    c.remaining = Number(c.planned_amount) - prevPaid;
    renderPagar();
    showToast('Erro ao registrar pagamento','error');
  }
}

// === PAGAR ===
function renderPagar() {
  const el = document.getElementById('pagar-root');

  // Somente contas manuais e pontuais (não automáticas)
  const pagarCmts = commitments.filter(c => c.recurrence_type !== 'automatico');

  const totalFaltante = pagarCmts.reduce((s,c) => s + Math.max(Number(c.remaining),0), 0);
  const qtdQuitadas   = pagarCmts.filter(c => Number(c.remaining) <= 0.005).length;

  const sorted = [...pagarCmts].sort((a,b) => prioridadeConta(a)-prioridadeConta(b) || (a.due_day||99)-(b.due_day||99));
  const PRIO_LABEL = ['🔴 Vencidas','🔴 Vencidas (parcial)','🟡 Hoje','⚡ Esta semana','📅 Próximas','✅ Pagas','🔵 Futuras'];
  let lastPrio = -1;
  const cmtHtml = sorted.map(c => {
    const p = prioridadeConta(c);
    let div = '';
    if (p !== lastPrio) { lastPrio = p; div = `<div class="secao-divider">${PRIO_LABEL[Math.min(p, PRIO_LABEL.length-1)]}</div>`; }
    return div + buildContaCard(c);
  }).join('');

  // Faturas de cartão (resumo colapsável)
  const proxMes = mesAtual===12 ? 1 : mesAtual+1;
  const proxAno = mesAtual===12 ? anoAtual+1 : anoAtual;
  const creditCards = paymentMethods.filter(p => p.type==='credito' && p.active!==false);
  const faturaHtml = creditCards.map(card => {
    const cardEntries = spendingSummary.filter(s => s.card_id===card.id);
    const total = cardEntries.reduce((s,x) => s+Number(x.total_spent), 0);
    if (!total) return '';
    const vencLabel = card.billing_day ? `vence dia ${card.billing_day}/${MESES[proxMes-1].slice(0,3)}` : MESES[proxMes-1];
    const faturaExiste = commitments.some(c => c.type==='fatura' && c.fatura_card_id===card.id && c.month===proxMes && c.year===proxAno);
    return `
      <div class="fatura-card">
        <div class="fatura-header">
          <div class="fatura-card-name">
            <span class="fatura-dot" style="background:${esc(card.color||'#555')}"></span>
            ${esc(card.name)}
          </div>
          <div class="fatura-total">R$ ${fmt(total)}</div>
        </div>
        <div class="fatura-sub">Consumo de ${mesLabel(mesAtual,anoAtual)} · ${vencLabel}</div>
        ${cardEntries.sort((a,b)=>Number(b.total_spent)-Number(a.total_spent)).map(s=>`
          <div class="fatura-cat-row">
            <span class="fatura-cat-name">${esc(s.category_emoji||'•')} ${esc(s.category_name)}</span>
            <span class="fatura-cat-val">R$ ${fmt(s.total_spent)}</span>
          </div>`).join('')}
        ${!faturaExiste && total > 0
          ? `<button class="btn-gen-fatura" onclick="gerarFatura('${esc(card.id)}',${total},${proxMes},${proxAno})">+ Gerar fatura de ${MESES[proxMes-1]} (R$ ${fmt(total)})</button>`
          : `<div style="font-size:12px;color:#555;text-align:center;margin-top:10px">✓ Fatura de ${MESES[proxMes-1]} já gerada</div>`}
      </div>`;
  }).filter(Boolean).join('');

  el.innerHTML = `
    <div class="contas-top-row">
      <div class="contas-top-title">Pagamentos</div>
    </div>
    <div class="contas-summary">
      <div class="cs-card"><div class="cs-label">A pagar</div><div class="cs-val red">R$ ${fmt(totalFaltante)}</div></div>
      <div class="cs-card"><div class="cs-label">Pagas</div><div class="cs-val green">${qtdQuitadas} / ${pagarCmts.length}</div></div>
    </div>
    ${cmtHtml || '<div class="empty-state"><div class="icon">✅</div>Nenhuma conta para pagar<br><small style="margin-top:8px;display:block">Adicione despesas manuais no Planejamento</small></div>'}
    ${faturaHtml ? `<div class="sec-title" style="margin-top:24px">💳 Faturas de cartão</div>${faturaHtml}` : ''}
  `;
}

async function gerarFatura(cardId, total, proxMes, proxAno) {
  const card = paymentMethods.find(p => p.id===cardId);
  try {
    await insertCommitment({
      month: proxMes, year: proxAno,
      name: `Fatura ${card?.name||'Cartão'}`,
      type: 'fatura', planned_amount: total,
      due_day: card?.billing_day || null,
      fatura_card_id: cardId,
      fatura_reference_month: mesAtual,
      fatura_reference_year: anoAtual
    });
    showToast(`Fatura de ${MESES[proxMes-1]} gerada ✓`, 'success');
    await loadMes();
  } catch(e) { showToast('Erro ao gerar fatura','error'); }
}

function renderGastos() {
  const el = document.getElementById('gastos-root');
  const catOpts = categories.map(c => `<option value="${esc(c.id)}">${esc(c.emoji||'')} ${esc(c.name)}</option>`).join('');
  const pmOpts  = paymentMethods.filter(p => p.active!==false).map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
  const totalGasto = spendingEntries.reduce((s,e) => s+Number(e.amount), 0);
  const hoje = new Date().toISOString().slice(0,10);

  const byDay = {};
  spendingEntries.forEach(e => {
    const d = e.spend_date ? e.spend_date.slice(0,10) : 'sem-data';
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(e);
  });
  const days = Object.keys(byDay).sort((a,b) => b.localeCompare(a));

  const listaHtml = days.length ? days.map(d => {
    const label = d==='sem-data' ? 'Sem data' : new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
    const items = byDay[d].map(e => {
      const cat = categories.find(c => c.id===e.category_id);
      const pm  = paymentMethods.find(p => p.id===e.payment_method_id);
      return `
        <div class="gasto-item">
          <div class="gasto-emoji">${esc(cat?.emoji||'💸')}</div>
          <div class="gasto-info">
            <div class="gasto-desc">${esc(e.description||cat?.name||'Gasto')}</div>
            <div class="gasto-meta">${esc(cat?.name||'')}${pm?' · '+esc(pm.name):''}</div>
          </div>
          <div class="gasto-valor">R$${fmt(e.amount)}</div>
          <button class="gasto-del" onclick="deletarGasto('${esc(e.id)}')">🗑</button>
        </div>`;
    }).join('');
    return `<div class="gastos-group-day"><div class="gastos-day-label">${label}</div>${items}</div>`;
  }).join('') : `<div class="empty-state"><div class="icon">💸</div>Nenhum gasto registrado neste mês</div>`;

  el.innerHTML = `
    <div class="gastos-form">
      <div class="gastos-form-title">Registrar gasto</div>
      <div class="field-row">
        <div class="field"><label>Valor (R$)</label>
          <input type="number" id="g-valor" placeholder="0,00" min="0" step="0.01" inputmode="decimal" />
        </div>
        <div class="field"><label>Categoria</label><select id="g-cat">${catOpts}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Método</label><select id="g-pm">${pmOpts}</select></div>
        <div class="field"><label>Data</label><input type="date" id="g-data" value="${hoje}" /></div>
      </div>
      <div class="field" style="margin-bottom:4px">
        <label>Descrição (opcional)</label>
        <input type="text" id="g-desc" placeholder="Ex: Mercado, almoço..." />
      </div>
      <button class="btn-registrar" onclick="addGasto()">+ Registrar gasto</button>
    </div>
    <div class="gastos-resumo">
      <div class="gr-card"><div class="gr-label">Total do mês</div><div class="gr-val red">R$${fmt(totalGasto)}</div></div>
      <div class="gr-card"><div class="gr-label">Lançamentos</div><div class="gr-val">${spendingEntries.length}</div></div>
    </div>
    ${listaHtml}
  `;
}

async function addGasto() {
  const valor = parseFloat(document.getElementById('g-valor')?.value);
  const catId = document.getElementById('g-cat')?.value;
  const pmId  = document.getElementById('g-pm')?.value;
  const data  = document.getElementById('g-data')?.value;
  const desc  = document.getElementById('g-desc')?.value?.trim();
  if (!valor||valor<=0) { showToast('Informe um valor válido','error'); return; }
  if (!catId)           { showToast('Selecione uma categoria','error'); return; }
  if (!pmId)            { showToast('Selecione o método','error'); return; }
  const d = data || new Date().toISOString().slice(0,10);
  const m = parseInt(d.slice(5,7)), y = parseInt(d.slice(0,4));
  const { data: row, error } = await sb.from('fin_spending_entries').insert({
    month:m, year:y, category_id:catId, payment_method_id:pmId,
    amount:valor, description:desc||null, spend_date:d
  }).select().single();
  if (error) { showToast('Erro: '+error.message,'error'); return; }
  spendingEntries.unshift(row);
  dirtyTabs.add('dashboard'); dirtyTabs.add('pagar');
  renderGastos();
  document.getElementById('g-valor').value = '';
  document.getElementById('g-desc').value  = '';
  showToast('Gasto registrado ✓','success');
}

async function deletarGasto(id) {
  if (!confirm('Remover este lançamento?')) return;
  const { error } = await sb.from('fin_spending_entries').delete().eq('id', id);
  if (error) { showToast('Erro ao remover','error'); return; }
  spendingEntries = spendingEntries.filter(e => e.id!==id);
  dirtyTabs.add('dashboard'); dirtyTabs.add('pagar');
  renderGastos();
  showToast('Lançamento removido','success');
}

        <div class="card-actions">
          <button class="btn-card-act" onclick="abrirCartaoModal('${esc(pm.id)}')">✏️</button>
          <button class="btn-card-act btn-card-del" onclick="deletarCartao('${esc(pm.id)}','${esc(pm.name)}')">🗑️</button>
        </div>
      </div>`;
  }).join('');

  const catsHtml = categories.map(cat => `
    <div class="cat-item">
      <span class="cat-emoji">${esc(cat.emoji||'•')}</span>
      <span class="cat-name">${esc(cat.name)}</span>
      <div class="cat-actions">
        <button class="btn-card-act" onclick="abrirCatModal('${esc(cat.id)}')">✏️</button>
        <button class="btn-card-act btn-card-del" onclick="deletarCategoria('${esc(cat.id)}','${esc(cat.name)}')">🗑️</button>
      </div>
    </div>`).join('');

  const tetosHtml = categories.map(cat => {
    const budget = categoryBudgets.find(b => b.category_id === cat.id && !b.month);
    const meta   = budget ? `Teto: R$ ${fmt(budget.limit_amount)}` : 'Sem teto';
    return `
      <div class="card-item">
        <span style="font-size:20px;min-width:28px;text-align:center">${esc(cat.emoji||'•')}</span>
        <div class="card-info">
          <div class="card-name">${esc(cat.name)}</div>
          <div class="card-meta">${meta}</div>
        </div>
        <div class="card-actions">
          <button class="btn-card-act" onclick="abrirTetoModal('${esc(cat.id)}')">✏️</button>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div style="text-align:center;margin-bottom:24px"><div class="perfil-avatar">👤</div></div>
    <div class="perfil-section">
      <div class="perfil-section-title">Dados pessoais</div>
      <div class="field"><label>Nome</label>
        <input type="text" id="p-nome" value="${esc(p.nome||'')}" placeholder="Seu nome" />
      </div>
      <div class="field"><label>💰 Renda mensal (R$)</label>
        <div class="perfil-renda">
          <input type="number" id="p-renda" value="${p.rendaMensal||''}" step="0.01" min="0" placeholder="Ex: 5000,00" inputmode="decimal" />
        </div>
      </div>
      <div class="field"><label>📅 Dia de recebimento</label>
        <input type="number" id="p-dia" value="${p.diaRecebimento||''}" min="1" max="31" placeholder="Ex: 30" />
      </div>
      <button class="btn-primary" onclick="salvarPerfil()" style="margin-top:4px">Salvar dados</button>
    </div>
    <div class="perfil-section">
      <div class="perfil-section-title">
        <span>Categorias</span>
        <button class="btn-nova" style="font-size:12px;padding:8px 14px" onclick="abrirCatModal()">+ Nova</button>
      </div>
      ${catsHtml || '<div style="font-size:13px;color:#444;text-align:center;padding:20px 0">Nenhuma categoria. Crie a primeira!</div>'}
    </div>
    <div class="perfil-section">
      <div class="perfil-section-title">Tetos de gastos</div>
      ${tetosHtml || '<div style="font-size:13px;color:#444;text-align:center;padding:20px 0">Crie categorias primeiro</div>'}
    </div>
    <div class="perfil-section">
      <div class="perfil-section-title">
        <span>Meus cartões</span>
        <button class="btn-nova" style="font-size:12px;padding:8px 14px" onclick="abrirCartaoModal()">+ Novo</button>
      </div>
      ${cardsHtml || '<div style="font-size:13px;color:#444;text-align:center;padding:20px 0">Nenhum cartão cadastrado</div>'}
      <button class="btn-add-card" onclick="abrirCartaoModal()">+ Adicionar cartão ou método</button>
    </div>
  `;
}

function carregarPerfil() {
  try { return JSON.parse(localStorage.getItem('oiv2_perfil')||'{}'); } catch { return {}; }
}

function salvarPerfil() {
  const nome  = document.getElementById('p-nome')?.value?.trim() || '';
  const dia   = parseInt(document.getElementById('p-dia')?.value) || null;
  const renda = parseFloat(document.getElementById('p-renda')?.value) || null;
  const p = carregarPerfil();
  p.nome = nome; p.diaRecebimento = dia; p.rendaMensal = renda;
  localStorage.setItem('oiv2_perfil', JSON.stringify(p));
  showToast('Perfil salvo ✓','success');
}

// === CRUD CATEGORIAS ===
const EMOJIS_SUGERIDOS = ['🏠','🚗','🍔','🛒','💊','🎮','📚','✈️','👕','🐾','💡','📱','🎬','🏋️','💰','🎁'];

function abrirCatModal(catId) {
  const cat = catId ? categories.find(c => c.id === catId) : null;
  const emojiOpts = EMOJIS_SUGERIDOS.map(e =>
    `<span class="emoji-opt${cat?.emoji===e?' sel':''}" onclick="selecionarEmoji(this,'${e}')">${e}</span>`
  ).join('');
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${cat ? 'Editar categoria' : 'Nova categoria'}</div>
    <input type="hidden" id="cat-id" value="${esc(catId||'')}" />
    <div class="field"><label>Emoji</label>
      <div class="emoji-picker">${emojiOpts}</div>
      <input type="text" id="cat-emoji" value="${esc(cat?.emoji||'')}" maxlength="2" placeholder="Ou digite um emoji..." style="margin-top:4px" />
    </div>
    <div class="field"><label>Nome</label>
      <input type="text" id="cat-nome" value="${esc(cat?.name||'')}" placeholder="Ex: Alimentação, Moradia..." />
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarCategoria()">Salvar</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('cat-nome')?.focus(), 100);
}

function selecionarEmoji(el, emoji) {
  document.querySelectorAll('.emoji-opt').forEach(e => e.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('cat-emoji').value = emoji;
}

async function salvarCategoria() {
  const catId = document.getElementById('cat-id').value;
  const emoji = document.getElementById('cat-emoji').value.trim() || '•';
  const nome  = document.getElementById('cat-nome').value.trim();
  if (!nome) { showToast('Informe o nome da categoria','error'); return; }
  try {
    if (catId) {
      const { error } = await sb.from('fin_categories').update({ name: nome, emoji }).eq('id', catId);
      if (error) throw error;
    } else {
      const { error } = await sb.from('fin_categories').insert({ name: nome, emoji });
      if (error) throw error;
    }
    const { data } = await sb.from('fin_categories').select('*').order('sort_order');
    categories = data || [];
    fecharModal();
    renderPerfil();
    dirtyTabs.add('planejamento'); dirtyTabs.add('pagar'); dirtyTabs.add('dashboard');
    showToast(catId ? 'Categoria atualizada ✓' : 'Categoria criada ✓', 'success');
  } catch(e) { showToast('Erro: '+(e.message||JSON.stringify(e)),'error'); }
}

async function deletarCategoria(id, nome) {
  if (!confirm(`Excluir categoria "${nome}"?`)) return;
  const { count } = await sb.from('fin_commitments').select('id', { count: 'exact', head: true }).eq('category_id', id);
  if (count > 0) { showToast('Categoria em uso, remova as despesas primeiro','error'); return; }
  const { error } = await sb.from('fin_categories').delete().eq('id', id);
  if (error) { showToast('Erro: '+error.message,'error'); return; }
  categories = categories.filter(c => c.id !== id);
  renderPerfil();
  dirtyTabs.add('planejamento'); dirtyTabs.add('pagar'); dirtyTabs.add('dashboard');
  showToast('Categoria removida','success');
}

function abrirCartaoModal(pmId) {
  const pm = pmId ? paymentMethods.find(p => p.id===pmId) : null;
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${pm?'Editar cartão':'Novo cartão / método'}</div>
    <input type="hidden" id="cart-id" value="${esc(pmId||'')}" />
    <div class="field"><label>Nome</label>
      <input type="text" id="cart-nome" value="${esc(pm?.name||'')}" placeholder="Ex: Nubank, Itaú Débito..." />
    </div>
    <div class="field"><label>Tipo</label>
      <select id="cart-tipo">
        <option value="credito"  ${pm?.type==='credito'?'selected':''}>💳 Crédito</option>
        <option value="debito"   ${pm?.type==='debito'?'selected':''}>🏦 Débito</option>
        <option value="pix"      ${pm?.type==='pix'?'selected':''}>📱 Pix / Transferência</option>
        <option value="dinheiro" ${pm?.type==='dinheiro'?'selected':''}>💵 Dinheiro</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field"><label>Dia vencimento (crédito)</label>
        <input type="number" id="cart-dia" value="${pm?.billing_day||''}" min="1" max="31" placeholder="Ex: 10" />
      </div>
      <div class="field"><label>Cor</label>
        <input type="color" id="cart-cor" value="${pm?.color||'#6366f1'}" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarCartao()">Salvar</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

async function salvarCartao() {
  const pmId = document.getElementById('cart-id').value;
  const nome = document.getElementById('cart-nome').value.trim();
  const tipo = document.getElementById('cart-tipo').value;
  const dia  = parseInt(document.getElementById('cart-dia').value) || null;
  const cor  = document.getElementById('cart-cor').value;
  if (!nome) { showToast('Informe o nome','error'); return; }
  try {
    if (pmId) {
      const { error: upErr } = await sb.from('fin_payment_methods').update({name:nome,type:tipo,billing_day:dia,color:cor}).eq('id',pmId);
      if (upErr) throw upErr;
    } else {
      await sb.from('fin_payment_methods').insert({name:nome,type:tipo,billing_day:dia,color:cor});
    }
    const { data } = await sb.from('fin_payment_methods').select('*').order('sort_order');
    paymentMethods = data || [];
    fecharModal();
    renderPerfil();
    showToast('Cartão salvo ✓','success');
  } catch(e) { showToast('Erro: '+(e.message||JSON.stringify(e)),'error'); }
}

async function deletarCartao(id, nome) {
  if (!confirm(`Excluir "${nome}"?`)) return;
  const { error } = await sb.from('fin_payment_methods').delete().eq('id', id);
  if (error) { showToast('Erro: '+error.message,'error'); return; }
  paymentMethods = paymentMethods.filter(p => p.id!==id);
  renderPerfil();
  showToast('Cartão removido','success');
}

// === TETOS DE GASTOS ===
function abrirTetoModal(catId) {
  const cat    = categories.find(c => c.id === catId);
  const budget = categoryBudgets.find(b => b.category_id === catId && !b.month);
  const valorAtual = budget ? Number(budget.limit_amount).toFixed(2) : '';
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">Teto de gasto — ${esc(cat?.emoji||'')} ${esc(cat?.name||'Categoria')}</div>
    <input type="hidden" id="teto-cat-id" value="${esc(catId)}" />
    <div class="field">
      <label>Limite mensal (R$)</label>
      <input type="number" id="teto-valor" value="${valorAtual}" step="0.01" min="0" placeholder="Ex: 1500,00" inputmode="decimal" />
    </div>
    <p style="font-size:12px;color:#555;margin-bottom:12px">Deixe vazio ou zero para remover o teto.</p>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarTeto()">Salvar</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('teto-valor')?.focus(), 100);
}

async function salvarTeto() {
  const catId = document.getElementById('teto-cat-id').value;
  const valor = parseFloat(document.getElementById('teto-valor').value) || 0;
  try {
    const existing = categoryBudgets.find(b => b.category_id === catId && !b.month);
    if (valor > 0) {
      if (existing) {
        const { error } = await sb.from('fin_category_budgets').update({ limit_amount: valor }).eq('id', existing.id);
        if (error) throw error;
      } else {
        const { error } = await sb.from('fin_category_budgets').insert({ category_id: catId, limit_amount: valor });
        if (error) throw error;
      }
    } else if (existing) {
      const { error } = await sb.from('fin_category_budgets').delete().eq('id', existing.id);
      if (error) throw error;
    }
    const { data } = await sb.from('fin_category_budgets').select('*');
    categoryBudgets = data || [];
    fecharModal();
    renderPerfil();
    dirtyTabs.add('dashboard');
    showToast(valor > 0 ? 'Teto salvo ✓' : 'Teto removido', 'success');
  } catch(e) { showToast('Erro: '+(e.message||JSON.stringify(e)), 'error'); }
}

// === MODAL ===
function fecharModal(e) {
  if (e instanceof Event && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.add('hidden');
}

// === ROUTING ===
function switchTab(tab) {
  abaAtiva = tab;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-content').forEach(p => p.classList.toggle('active', p.id==='tab-'+tab));
  if (dirtyTabs.has(tab)) { dirtyTabs.delete(tab); renderAtivo(); }
}

function renderAtivo() {
  if (abaAtiva==='dashboard')    renderDashboard();
  if (abaAtiva==='planejamento') renderPlanejamento();
  if (abaAtiva==='pagar')        renderPagar();
  if (abaAtiva==='gastos')       renderGastos();
  if (abaAtiva==='perfil')       renderPerfil();
}

function navMes(delta) {
  mesAtual += delta;
  if (mesAtual>12) { mesAtual=1;  anoAtual++; }
  if (mesAtual<1)  { mesAtual=12; anoAtual--; }
  loadMes();
}

async function recarregar() { await loadAll(); showToast('Dados atualizados ✓','success'); }

async function retentarUltimaAcao() {
  if (!ultimaAcaoParams) return;
  document.getElementById('toast-retry').style.display = 'none';
  const p = ultimaAcaoParams; ultimaAcaoParams = null;
  try { await p.fn(); } catch(e) { showToast('Falhou novamente: '+e.message,'error'); }
}

document.addEventListener('DOMContentLoaded', () => { loadAll(); });
</script>
</body>
</html>
