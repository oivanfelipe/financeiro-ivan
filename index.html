<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orçamento Ivan v2</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a; color: #f0f0f0;
      min-height: 100vh; display: flex;
      align-items: flex-start; justify-content: center;
      padding: 20px 12px 60px;
    }
    .card {
      background: #141414; border: 1px solid #222;
      border-radius: 18px; padding: 22px 20px 32px;
      width: 100%; max-width: 560px;
    }

    /* ── Header ── */
    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .app-title { font-size: 18px; font-weight: 700; color: #fff; }
    .app-title span { color: #6366f1; }
    .header-actions { display: flex; gap: 8px; }
    .btn-icon {
      background: #1e1e1e; border: 1px solid #2a2a2a; color: #666;
      border-radius: 8px; padding: 6px 10px; font-size: 14px;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-icon:hover { border-color: #444; color: #aaa; }

    /* ── Mês nav ── */
    .mes-nav {
      display: flex; align-items: center; justify-content: space-between;
      background: #1a1a1a; border: 1px solid #222; border-radius: 10px;
      padding: 8px 14px; margin-bottom: 16px;
    }
    .mes-nav-btn {
      background: none; border: none; color: #555; font-size: 18px;
      cursor: pointer; padding: 2px 6px; transition: color 0.15s;
    }
    .mes-nav-btn:hover { color: #aaa; }
    .mes-nav-label { font-size: 14px; font-weight: 600; color: #e0e0e0; }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 3px; background: #0f0f0f;
      border-radius: 10px; padding: 3px; margin-bottom: 20px; overflow-x: auto;
    }
    .tab-btn {
      flex: 1; padding: 8px 4px; border: none; background: transparent;
      color: #555; border-radius: 7px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.15s; white-space: nowrap; min-width: 60px;
    }
    .tab-btn.active { background: #1e1e1e; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1e1e1e; border: 1px solid #333; color: #f0f0f0;
      border-radius: 24px; padding: 10px 18px; font-size: 13px;
      display: flex; align-items: center; gap: 10px;
      transition: transform 0.3s ease; z-index: 100; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: #2a0a0a; border-color: #5a1a1a; color: #f87171; }
    .toast.success { background: #0a2a0a; border-color: #1a5a1a; color: #4ade80; }
    .btn-retry {
      background: rgba(255,255,255,0.15); border: none; border-radius: 14px;
      color: #fff; font-size: 11px; font-weight: 600; padding: 3px 10px;
      cursor: pointer; white-space: nowrap;
    }

    /* ── Loading ── */
    .loading { display: flex; align-items: center; gap: 10px; padding: 32px 0; color: #555; font-size: 13px; }
    .spinner { width: 20px; height: 20px; border: 2px solid #333; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Aviso ── */
    .aviso {
      background: #1a0a0a; border: 1px solid #3a1a1a; color: #f87171;
      border-radius: 10px; padding: 10px 14px; font-size: 12px;
      line-height: 1.5; margin-bottom: 14px;
    }
    .aviso.warn { background: #141008; border-color: #3a2a08; color: #fbbf24; }

    /* ── Dashboard ── */
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .dash-card {
      background: #1a1a1a; border: 1px solid #222; border-radius: 12px; padding: 14px;
    }
    .dash-card.wide { grid-column: 1 / -1; }
    .dash-card.highlight { border-color: #6366f1; }
    .dash-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .dash-value { font-size: 22px; font-weight: 700; color: #fff; }
    .dash-value.green { color: #4ade80; }
    .dash-value.red   { color: #f87171; }
    .dash-value.amber { color: #fbbf24; }
    .dash-sub { font-size: 11px; color: #555; margin-top: 4px; }
    .progress-bar { background: #222; border-radius: 99px; height: 6px; margin-top: 8px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; background: #4ade80; }
    .progress-fill.amber { background: #fbbf24; }
    .progress-fill.red   { background: #f87171; }

    /* ── Seção título ── */
    .sec-title {
      font-size: 12px; font-weight: 600; color: #555;
      text-transform: uppercase; letter-spacing: 0.08em;
      margin: 18px 0 10px;
    }
    .sec-divider { border: none; border-top: 1px solid #1e1e1e; margin: 14px 0; }

    /* ── Categoria card ── */
    .cat-block { background: #1a1a1a; border: 1px solid #222; border-radius: 12px; padding: 14px; margin-bottom: 8px; }
    .cat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .cat-name { font-size: 14px; font-weight: 600; color: #e0e0e0; }
    .cat-amounts { font-size: 12px; color: #666; }
    .cat-items { margin-top: 10px; }
    .cat-item-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; border-top: 1px solid #1e1e1e; }
    .cat-item-name { color: #888; }
    .cat-item-val  { color: #ccc; }

    /* ── Alertas ── */
    .alert-list { margin-bottom: 10px; }
    .alert-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #1f0a0a; border: 1px solid #3a1414;
      border-radius: 8px; margin-bottom: 4px; font-size: 12px;
    }
    .alert-item .name { color: #fca5a5; }
    .alert-item .val  { color: #f87171; font-weight: 600; }
    .warn-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #1a1408; border: 1px solid #3a2a08;
      border-radius: 8px; margin-bottom: 4px; font-size: 12px;
    }
    .warn-item .name { color: #fde68a; }
    .warn-item .val  { color: #fbbf24; font-weight: 600; }

    /* ── Chart ── */
    .chart-wrap { position: relative; max-width: 200px; margin: 0 auto 16px; }
    .chart-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    .chart-center-label { font-size: 10px; color: #555; }
    .chart-center-val   { font-size: 16px; font-weight: 700; color: #fff; }

    /* ── Chat ── */
    .chat-wrap { display: flex; flex-direction: column; height: 480px; }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 4px 0 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .chat-bubble {
      max-width: 85%; padding: 10px 14px; border-radius: 14px;
      font-size: 13px; line-height: 1.5; white-space: pre-wrap;
    }
    .bubble-user {
      align-self: flex-end; background: #6366f1; color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble-ai {
      align-self: flex-start; background: #1e1e1e; color: #e0e0e0;
      border: 1px solid #2a2a2a; border-bottom-left-radius: 4px;
    }
    .bubble-system {
      align-self: center; background: #141414; color: #555;
      font-size: 11px; padding: 5px 12px; border-radius: 99px;
    }
    .bubble-tool {
      align-self: flex-start; background: #0f1a0f; border: 1px solid #1a3a1a;
      color: #4ade80; font-size: 11px; font-family: monospace;
      border-radius: 8px; padding: 6px 10px;
    }
    .chat-typing { align-self: flex-start; color: #555; font-size: 12px; padding: 4px 0; }
    .chat-input-row { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid #1e1e1e; }
    .chat-input {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 10px; padding: 10px 14px; color: #f0f0f0;
      font-size: 13px; resize: none; outline: none; height: 42px;
      transition: border-color 0.15s; font-family: inherit;
    }
    .chat-input:focus { border-color: #6366f1; }
    .btn-send {
      background: #6366f1; border: none; color: #fff; border-radius: 10px;
      padding: 10px 16px; font-size: 14px; cursor: pointer; transition: background 0.15s;
      display: flex; align-items: center;
    }
    .btn-send:hover { background: #4f46e5; }
    .btn-send:disabled { background: #333; cursor: not-allowed; }
    .chat-key-setup {
      background: #1a1a1a; border: 1px dashed #333; border-radius: 12px;
      padding: 20px; text-align: center; margin-bottom: 16px;
    }
    .chat-key-setup p { font-size: 13px; color: #888; margin-bottom: 12px; }
    .input-key {
      width: 100%; background: #111; border: 1px solid #333; border-radius: 8px;
      padding: 8px 12px; color: #f0f0f0; font-size: 13px; outline: none; margin-bottom: 8px;
    }
    .input-key:focus { border-color: #6366f1; }
    .btn-primary {
      background: #6366f1; border: none; color: #fff; border-radius: 8px;
      padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 0.15s; width: 100%;
    }
    .btn-primary:hover { background: #4f46e5; }

    /* ── Contas ── */
    .contas-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #1a1a1a; border: 1px solid #222;
      border-radius: 10px; margin-bottom: 14px;
    }
    .contas-header-val { font-size: 18px; font-weight: 700; color: #f87171; }
    .contas-header-label { font-size: 11px; color: #555; margin-bottom: 2px; }
    .contas-header-sub { font-size: 12px; color: #4ade80; font-weight: 600; }

    /* entradas previstas */
    .income-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: #0a1a0a; border: 1px solid #1a3a1a;
      border-radius: 10px; margin-bottom: 8px;
    }
    .income-name { font-size: 13px; color: #a7f3d0; font-weight: 500; }
    .income-right { text-align: right; }
    .income-val  { font-size: 14px; font-weight: 700; color: #4ade80; }
    .income-day  { font-size: 11px; color: #555; }
    .badge-received { background: #1a3a1a; color: #4ade80; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
    .badge-expected { background: #1a2a1a; color: #6b9; font-size: 10px; padding: 2px 7px; border-radius: 99px; }

    /* secao divider */
    .secao-divider {
      font-size: 10px; font-weight: 700; color: #444; text-transform: uppercase;
      letter-spacing: 0.1em; padding: 8px 0 4px; display: flex; align-items: center; gap: 8px;
    }
    .secao-divider::after { content: ''; flex: 1; height: 1px; background: #1e1e1e; }

    /* conta card */
    .conta-card {
      background: #1a1a1a; border: 1px solid #222; border-radius: 12px;
      padding: 14px; margin-bottom: 8px; transition: border-color 0.15s;
    }
    .conta-card.overdue { border-color: #3a1414; }
    .conta-card.today   { border-color: #3a2a08; }
    .conta-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .conta-name { font-size: 14px; font-weight: 500; color: #e0e0e0; }
    .conta-meta { font-size: 11px; color: #555; margin-top: 2px; }
    .conta-right { text-align: right; flex-shrink: 0; }
    .conta-val  { font-size: 16px; font-weight: 700; color: #fff; }
    .conta-paid { font-size: 11px; color: #4ade80; margin-top: 2px; }
    .conta-remaining { font-size: 11px; color: #f87171; margin-top: 2px; }

    /* badges de status */
    .badge {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      border-radius: 99px; margin-top: 6px;
    }
    .badge-pago     { background: #0a2a0a; color: #4ade80; }
    .badge-parcial  { background: #0a1a2a; color: #60a5fa; }
    .badge-vencido  { background: #2a0a0a; color: #f87171; }
    .badge-hoje     { background: #2a1a00; color: #fbbf24; }
    .badge-semana   { background: #1a1a00; color: #fcd34d; }
    .badge-futuro   { background: #111; color: #555; }
    .badge-auto     { background: #1a1a2a; color: #818cf8; }
    .badge-fatura   { background: #1a0a2a; color: #c084fc; }

    /* barra de progresso da conta */
    .conta-prog { margin-top: 8px; }
    .conta-prog .progress-bar { height: 4px; }

    /* pay form */
    .pay-form {
      margin-top: 12px; padding-top: 12px; border-top: 1px solid #1e1e1e;
      display: none;
    }
    .pay-form.open { display: block; }
    .pay-row { display: flex; gap: 8px; align-items: center; }
    .pay-input {
      flex: 1; background: #111; border: 1px solid #2a2a2a; border-radius: 8px;
      padding: 8px 12px; color: #f0f0f0; font-size: 14px; outline: none;
    }
    .pay-input:focus { border-color: #6366f1; }
    .btn-pay {
      background: #6366f1; border: none; color: #fff; border-radius: 8px;
      padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-pay:hover { background: #4f46e5; }
    .btn-pay-open {
      background: none; border: 1px solid #2a2a2a; color: #666;
      border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer;
      margin-top: 8px; transition: all 0.15s;
    }
    .btn-pay-open:hover { border-color: #444; color: #aaa; }
    .pay-total-preview { font-size: 11px; color: #555; margin-top: 6px; }
    .conta-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .btn-edit-conta {
      background: none; border: 1px solid #2a2a2a; color: #666;
      border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; transition: all 0.15s;
    }
    .btn-edit-conta:hover { border-color: #6366f1; color: #6366f1; }
    .btn-del-conta {
      background: none; border: 1px solid #2a2a2a; color: #666;
      border-radius: 8px; padding: 5px 8px; font-size: 13px; cursor: pointer; transition: all 0.15s;
    }
    .btn-del-conta:hover { border-color: #ef4444; color: #ef4444; }

    /* ── Faturas ── */
    .fatura-card {
      background: #1a1a1a; border: 1px solid #222; border-radius: 12px;
      padding: 16px; margin-bottom: 10px;
    }
    .fatura-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .fatura-card-name { font-size: 15px; font-weight: 600; color: #e0e0e0; display: flex; align-items: center; gap: 8px; }
    .fatura-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .fatura-total { font-size: 20px; font-weight: 700; color: #fff; }
    .fatura-sub { font-size: 11px; color: #555; }
    .fatura-cats { margin-top: 10px; }
    .fatura-cat-row {
      display: flex; justify-content: space-between; padding: 5px 0;
      font-size: 12px; border-top: 1px solid #1e1e1e;
    }
    .fatura-cat-name { color: #888; }
    .fatura-cat-val  { color: #ccc; font-weight: 500; }
    .btn-gen-fatura {
      width: 100%; background: #1a1a2a; border: 1px solid #2a2a3a;
      color: #818cf8; border-radius: 8px; padding: 9px; font-size: 13px;
      cursor: pointer; margin-top: 10px; transition: all 0.15s;
    }
    .btn-gen-fatura:hover { background: #222; }

    /* histórico mini */
    .hist-wrap { margin-top: 10px; }
    .hist-title { font-size: 11px; color: #444; margin-bottom: 6px; cursor: pointer; }
    .hist-item { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; color: #666; border-top: 1px solid #1a1a1a; }

    /* ── Gestão ── */
    .gestao-section { margin-bottom: 20px; }
    .gestao-section-title {
      font-size: 12px; font-weight: 700; color: #555; text-transform: uppercase;
      letter-spacing: 0.08em; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .btn-add {
      background: #1e1e1e; border: 1px solid #2a2a2a; color: #818cf8;
      border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer;
    }
    .gestao-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; background: #1a1a1a; border: 1px solid #222;
      border-radius: 8px; margin-bottom: 6px;
    }
    .gestao-item-name { font-size: 13px; color: #e0e0e0; }
    .gestao-item-sub  { font-size: 11px; color: #555; margin-top: 2px; }
    .gestao-item-actions { display: flex; gap: 6px; }
    .btn-edit, .btn-del {
      background: none; border: 1px solid #2a2a2a; border-radius: 6px;
      padding: 3px 8px; font-size: 11px; cursor: pointer;
    }
    .btn-edit { color: #818cf8; }
    .btn-del  { color: #f87171; }

    /* budget limit row */
    .budget-limit-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #1a1a1a; border: 1px solid #222;
      border-radius: 8px; margin-bottom: 6px;
    }
    .budget-limit-cat { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #e0e0e0; }
    .budget-limit-input {
      width: 110px; background: #111; border: 1px solid #2a2a2a; border-radius: 6px;
      padding: 5px 10px; color: #f0f0f0; font-size: 13px; text-align: right; outline: none;
    }
    .budget-limit-input:focus { border-color: #6366f1; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: #141414; border: 1px solid #2a2a2a; border-radius: 16px;
      padding: 24px; width: 100%; max-width: 420px;
    }
    .modal-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 18px; }
    .modal-footer { display: flex; gap: 8px; margin-top: 20px; }
    .btn-cancel {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #888;
      border-radius: 8px; padding: 10px; font-size: 13px; cursor: pointer;
    }
    .btn-save {
      flex: 2; background: #6366f1; border: none; color: #fff;
      border-radius: 8px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-save:hover { background: #4f46e5; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11px; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field input, .field select, .field textarea {
      width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 8px; padding: 9px 12px; color: #f0f0f0;
      font-size: 13px; outline: none; transition: border-color 0.15s; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #6366f1; }
    .field select option { background: #1a1a1a; }
    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }
    .radio-group { display: flex; gap: 8px; }
    .radio-opt {
      flex: 1; padding: 8px; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 8px; text-align: center; font-size: 12px; color: #888;
      cursor: pointer; transition: all 0.15s;
    }
    .radio-opt.selected { border-color: #6366f1; color: #818cf8; background: #1a1a2a; }

    /* ── Copiar mês ── */
    .btn-copiar-mes {
      width: 100%; background: #1a1a2a; border: 1px dashed #333; color: #818cf8;
      border-radius: 10px; padding: 12px; font-size: 13px; cursor: pointer;
      margin-bottom: 16px; transition: background 0.15s;
    }
    .btn-copiar-mes:hover { background: #1e1e2e; }

    /* ── Gastos ── */
    .gastos-form {
      background: #141414; border: 1px solid #222; border-radius: 14px;
      padding: 16px; margin-bottom: 18px;
    }
    .gastos-form-title { font-size: 12px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
    .gastos-form-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .gastos-form-row .field { flex: 1; margin-bottom: 0; }
    .gastos-form-row .field.valor-field { flex: 0 0 120px; }
    .btn-registrar-gasto {
      width: 100%; background: #22c55e; border: none; color: #fff;

<script>

const SUPABASE_URL  = 'https://mzwynanvhojzyoirvxkc.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16d3luYW52aG9qenlvaXJ2eGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5Mjc3NjEsImV4cCI6MjEwMTUwMzc2MX0.UniVWAVDJgyHo8QGlqXjMeTBulsjEDdZ5nyBWowYO2s';

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// === STATE ===
let mesAtual        = new Date().getMonth() + 1;

// Dados do mês

// === UTILS ===
const fmt  = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtK = v => { const n = Number(v) || 0; return n >= 1000 ? `R$ ${(n/1000).toFixed(1)}k` : `R$ ${fmt(n)}`; };
const esc  = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const normalizar = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();

function showToast(msg, type = '', showRetry = false) {
  document.getElementById('toast-msg').textContent = msg;
  const t = document.getElementById('toast');
  t.className = 'toast show' + (type ? ' ' + type : '');
  document.getElementById('toast-retry').style.display = (showRetry && ultimaAcaoParams) ? 'inline-block' : 'none';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { t.className = 'toast' + (type ? ' ' + type : ''); }, 4000);
}

function avisar(html, tipo) {
  document.getElementById('aviso-global').innerHTML = html ? `<div class="aviso ${tipo||''}">${html}</div>` : '';
}

function mesLabel(m, y) { return `${MESES[m-1]} ${y}`; }

function statusConta(item, venc) {
  const pct = item.planned_amount > 0 ? (item.paid / item.planned_amount) : 0;
  if (pct >= 0.9995) return 'pago';
  if (item.paid > 0) return 'parcial';
  if (item.type === 'fatura') return 'fatura';
  if (!venc) return 'futuro';
  const hoje = new Date().getDate();
  if (venc < hoje) return 'vencido';
  if (venc === hoje) return 'hoje';
  if (venc - hoje <= 3) return 'semana';
  return 'futuro';
}

function prioridadeConta(item) {
  const venc = item.due_day;
  const s = statusConta(item, venc);
  if (s === 'vencido')  return item.paid > 0 ? 1 : 0;
  if (s === 'hoje')     return 2;
  if (s === 'semana')   return 3;
  if (s === 'fatura' || s === 'futuro') return 4;
  if (s === 'parcial')  return 5;
  if (s === 'pago')     return 6;
  return 7;
}

function corCategoria(nome) {
  const c = categories.find(x => x.name === nome);
  return c ? c.color : '#94a3b8';
}
function emojiCategoria(nome) {
  const c = categories.find(x => x.name === nome);
  return c ? c.emoji : '•';
}

function getLimitForCategory(catId) {
  const specific = categoryBudgets.find(b => b.category_id === catId && b.month === mesAtual && b.year === anoAtual);
  if (specific) return specific.limit_amount;
  const template = categoryBudgets.find(b => b.category_id === catId && !b.month);
  return template ? template.limit_amount : null;
}

// === SUPABASE API ===
async function loadAll() {
  document.getElementById('btn-refresh').disabled = true;
  try {
    const [cats, pms, budgets] = await Promise.all([
      sb.from('fin_categories').select('*').order('sort_order'),
      sb.from('fin_payment_methods').select('*').where ? sb.from('fin_payment_methods').select('*').order('sort_order') : sb.from('fin_payment_methods').select('*').order('sort_order'),
      sb.from('fin_category_budgets').select('*')
    ]);
    categories     = cats.data || [];
    paymentMethods = pms.data  || [];
    categoryBudgets = budgets.data || [];
    await loadMes();
  } catch(e) {
    avisar('Erro ao conectar ao banco de dados. Verifique a conexão.', '');
  } finally {
    document.getElementById('btn-refresh').disabled = false;
  }
}

async function loadMes() {
  document.getElementById('mes-label').textContent = mesLabel(mesAtual, anoAtual);
  dirtyTabs = new Set(['dashboard','contas','faturas','gastos']);

  const [cmts, inc, spend, spSum] = await Promise.all([
    sb.from('fin_commitment_summary').select('*').eq('month', mesAtual).eq('year', anoAtual).order('due_day'),
    sb.from('fin_income_items').select('*').eq('month', mesAtual).eq('year', anoAtual).order('expected_day'),
    sb.from('fin_spending_entries').select('*').eq('month', mesAtual).eq('year', anoAtual).order('spend_date', { ascending: false }),
    sb.from('fin_spending_summary').select('*').eq('month', mesAtual).eq('year', anoAtual)
  ]);

  commitments     = cmts.data  || [];
  incomeItems     = inc.data   || [];
  spendingEntries = spend.data || [];
  spendingSummary = spSum.data || [];

  // cashflow via RPC
  const { data: cf } = await sb.rpc('fin_monthly_cashflow', { p_month: mesAtual, p_year: anoAtual });
  cashflow = (cf && cf[0]) || null;

  renderAtivo();
  dirtyTabs.delete(abaAtiva);
}

async function insertSpending(catId, cardId, amount, description, date) {
  const m = new Date(date).getMonth() + 1;
  const y = new Date(date).getFullYear();
  const { data, error } = await sb.from('fin_spending_entries').insert({
    month: m, year: y,
    category_id: catId,
    payment_method_id: cardId,
    amount: Number(amount),
    description,
    spend_date: date
  }).select().single();
  if (error) throw error;
  return data;
}

async function insertCommitment(payload) {
  const { data, error } = await sb.from('fin_commitments').insert(payload).select().single();
  if (error) throw error;
  return data;
}

async function insertPayment(commitmentId, amount, note, date) {
  const { data, error } = await sb.from('fin_commitment_payments').insert({
    commitment_id: commitmentId,
    amount: Number(amount),
    note: note || null,
    payment_date: date || new Date().toISOString().slice(0,10)
  }).select().single();
  if (error) throw error;
  return data;
}

async function updateIncomeReceived(incomeId, actualAmount, date) {
  const { error } = await sb.from('fin_income_items').update({
    actual_amount: Number(actualAmount),
    received_date: date,
    is_received: true
  }).eq('id', incomeId);
  if (error) throw error;
}

// === OPENAI CHAT ===
const FINANCE_TOOLS = [
  {
    type: 'function',
    function: {
      name: 'get_monthly_summary',
      description: 'Retorna o resumo financeiro do mês: entradas, comprometimentos e sobra',
      parameters: {
        type: 'object',
        properties: {

        }
      }
    }
  },
  {
    type: 'function',

      description: 'Retorna gastos de consumo no cartão agrupados por categoria no mês',

        type: 'object',

      }

  {

  },
  {

async function buildSystemPrompt() {
  const catsList  = categories.map(c => `${c.name} (id:${c.id})`).join(', ');
  const cardsList = paymentMethods.filter(p => p.active).map(p => `${p.name} (tipo:${p.type})`).join(', ');
  const hoje      = new Date().toLocaleDateString('pt-BR');
  const cfLine    = cashflow
    ? `Entradas previstas: R$${fmt(cashflow.income_expected)} | Comprometimentos: R$${fmt(cashflow.commitments_total)} | Sobra prevista: R$${fmt(cashflow.surplus_expected)}`
    : 'Dados do mês ainda não carregados';

  return `Você é o assistente financeiro pessoal do Ivan. Data de hoje: ${hoje}. Mês atual: ${mesLabel(mesAtual, anoAtual)}.

Categorias disponíveis: ${catsList || 'nenhuma cadastrada ainda'}.
Cartões/métodos: ${cardsList || 'nenhum cadastrado ainda'}.
Resumo do mês: ${cfLine}.

Regras:
- Sempre responda em português brasileiro, de forma direta e prática.
- Ao registrar gastos, confirme o que foi registrado com o valor e categoria.
- Se o usuário mencionar um cartão, use o mais próximo pelo nome.
- Se a categoria não for clara, pergunte antes de registrar.
- Formate valores como R$ X.XXX,XX.
- Para consultas de dados, use as funções disponíveis com o mês/ano atual quando não especificado.`;
}

async function executeTool(name, args) {
  const m = args.month || mesAtual;
  const y = args.year  || anoAtual;

  if (name === 'get_monthly_summary') {
    const { data } = await sb.rpc('fin_monthly_cashflow', { p_month: m, p_year: y });
    return JSON.stringify(data?.[0] || {});
  }
  if (name === 'get_spending_by_category') {
    const { data } = await sb.from('fin_spending_summary').select('*').eq('month', m).eq('year', y);
    return JSON.stringify(data || []);
  }
  if (name === 'get_commitments') {
    const { data } = await sb.from('fin_commitment_summary').select('*').eq('month', m).eq('year', y).order('due_day');
    return JSON.stringify(data || []);
  }
  if (name === 'get_card_spending') {
    const { data } = await sb.from('fin_card_monthly_total').select('*').eq('month', m).eq('year', y);
    return JSON.stringify(data || []);
  }
  if (name === 'add_spending') {
    const cat  = categories.find(c => normalizar(c.name).includes(normalizar(args.category_name)));
    const card = paymentMethods.find(p => normalizar(p.name).includes(normalizar(args.card_name)));
    if (!cat)  return JSON.stringify({ error: `Categoria "${args.category_name}" não encontrada. Disponíveis: ${categories.map(c=>c.name).join(', ')}` });
    if (!card) return JSON.stringify({ error: `Cartão "${args.card_name}" não encontrado. Disponíveis: ${paymentMethods.map(p=>p.name).join(', ')}` });
    const date = args.date || new Date().toISOString().slice(0,10);
    const data = await insertSpending(cat.id, card.id, args.amount, args.description || '', date);
    await loadMes();
    return JSON.stringify({ success: true, registered: { category: cat.name, card: card.name, amount: args.amount, date } });
  }
  if (name === 'get_spending_history') {
    const lim = args.limit || 10;
    const { data } = await sb.from('fin_spending_entries')
      .select('*, fin_categories(name,emoji), fin_payment_methods(name)')
      .order('spend_date', { ascending: false })
      .limit(lim);
    return JSON.stringify(data || []);
  }
  return JSON.stringify({ error: 'Função não implementada' });
}

async function sendChat(userMsg) {
  if (!groqKey) { showToast('Configure a chave Groq primeiro', 'error'); return; }
  if (chatTyping) return;

  chatHistory.push({ role: 'user', content: userMsg });
  chatTyping = true;
  renderChatMessages();

  try {
    const system = await buildSystemPrompt();
    let messages = [{ role: 'system', content: system }, ...chatHistory];

    // Agentic loop — up to 5 turns to resolve tool calls
    for (let i = 0; i < 5; i++) {
      const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${groqKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'meta-llama/llama-4-scout-17b-16e-instruct', messages, tools: FINANCE_TOOLS, tool_choice: 'auto' })
      });
      if (!resp.ok) { const e = await resp.json(); throw new Error(e.error?.message || `HTTP ${resp.status}`); }
      const data = await resp.json();
      const msg  = data.choices[0].message;
      messages.push(msg);

      if (msg.tool_calls && msg.tool_calls.length > 0) {
        // Execute all tool calls
        for (const tc of msg.tool_calls) {
          const result = await executeTool(tc.function.name, JSON.parse(tc.function.arguments || '{}'));
          messages.push({ role: 'tool', tool_call_id: tc.id, content: result });
        }
        // Update typing indicator
        renderChatMessages(true);
        continue;
      }

      // Final answer
      chatHistory.push({ role: 'assistant', content: msg.content });
      break;
    }
  } catch(e) {
    chatHistory.push({ role: 'assistant', content: `Erro: ${e.message}` });
  } finally {
    chatTyping = false;
    renderChatMessages();
  }
}

// === RENDER: DASHBOARD ===
function renderDashboard() {
  const el = document.getElementById('dash-root');
  if (!cashflow) { el.innerHTML = '<div class="empty-state"><div class="icon">📊</div>Nenhum dado para este mês</div>'; return; }

  const cf = cashflow;
  const totalSpent = spendingSummary.reduce((s, x) => s + Number(x.total_spent), 0);
  const totalInc   = Number(cf.income_expected);
  const totalCmt   = Number(cf.commitments_total);
  const sobra      = Number(cf.surplus_expected);
  const sobraClass = sobra >= 0 ? 'green' : 'red';

  // Spending by category with limits
  const spendByCat = {};
  spendingSummary.forEach(s => {
    if (!spendByCat[s.category_name]) spendByCat[s.category_name] = { spent: 0, catId: s.category_id, emoji: s.category_emoji, color: s.category_color };
    spendByCat[s.category_name].spent += Number(s.total_spent);
  });

  // Over budget categories
  const overBudget = Object.entries(spendByCat).filter(([n, d]) => {
    const lim = getLimitForCategory(d.catId);
    return lim && d.spent > lim;
  });

  const cmtPct = totalCmt > 0 ? Math.min((Number(cf.commitments_paid) / totalCmt) * 100, 100) : 0;
  const cmtClass = cmtPct >= 100 ? 'green' : cmtPct >= 80 ? 'amber' : '';

  // Card totals
  const cardTotals = {};
  spendingSummary.forEach(s => {
    if (!cardTotals[s.card_name]) cardTotals[s.card_name] = { total: 0, color: s.card_color };
    cardTotals[s.card_name].total += Number(s.total_spent);
  });
  const cardChips = Object.entries(cardTotals).map(([name, d]) =>
    `<span style="background:#1a1a1a;border:1px solid #222;border-radius:99px;padding:4px 10px;font-size:11px;color:#ccc;display:inline-flex;align-items:center;gap:5px">
      <span style="width:8px;height:8px;border-radius:50%;background:${esc(d.color||'#555')}"></span>
      ${esc(name)} R$ ${fmt(d.total)}
    </span>`
  ).join('');

  // Category breakdown (spending vs limit)
  const catRows = Object.entries(spendByCat).sort((a,b) => b[1].spent - a[1].spent).map(([name, d]) => {
    const lim = getLimitForCategory(d.catId);
    const pct = lim ? Math.min((d.spent / lim) * 100, 100) : null;
    const barClass = pct === null ? '' : pct >= 100 ? 'red' : pct >= 80 ? 'amber' : '';
    const badge = lim && d.spent > lim
      ? `<span style="font-size:10px;color:#f87171">⚠ +R$ ${fmt(d.spent - lim)}</span>`
      : (pct !== null ? `<span style="font-size:10px;color:#555">${pct.toFixed(0)}%</span>` : '');
    return `
      <div class="cat-block">
        <div class="cat-header">
          <div class="cat-name">${d.emoji||'•'} ${esc(name)}</div>
          <div>${badge}</div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#666;margin-bottom:4px">
          <span>R$ ${fmt(d.spent)}</span>
          ${lim ? `<span>Teto: R$ ${fmt(lim)}</span>` : ''}
        </div>
        ${pct !== null ? `<div class="progress-bar"><div class="progress-fill ${barClass}" style="width:${pct}%"></div></div>` : ''}
      </div>`;
  }).join('');

  // Donut chart data
  const chartLabels = Object.keys(spendByCat);
  const chartData   = chartLabels.map(n => spendByCat[n].spent);
  const chartColors = chartLabels.map(n => spendByCat[n].color || '#94a3b8');

  el.innerHTML = `
    <div class="dash-grid">
      <div class="dash-card">
        <div class="dash-label">Entradas previstas</div>
        <div class="dash-value">${fmtK(totalInc)}</div>
        <div class="dash-sub">Recebido: R$ ${fmt(cf.income_received)}</div>
      </div>
      <div class="dash-card">
        <div class="dash-label">Comprometido</div>
        <div class="dash-value">${fmtK(totalCmt)}</div>
        <div class="dash-sub">Pago: R$ ${fmt(cf.commitments_paid)}</div>
        <div class="progress-bar"><div class="progress-fill ${cmtClass}" style="width:${cmtPct}%"></div></div>
      </div>
      <div class="dash-card wide highlight">
        <div class="dash-label">Sobra prevista do mês</div>
        <div class="dash-value ${sobraClass}" data-kpi="sobra">R$ ${fmt(sobra)}</div>
        <div class="dash-sub">Sobra real até agora: R$ ${fmt(cf.surplus_actual)}</div>
      </div>
    </div>

    ${overBudget.length > 0 ? `
      <div class="sec-title">⚠ Acima do teto</div>
      <div class="alert-list">
        ${overBudget.map(([n,d]) => {
          const lim = getLimitForCategory(d.catId);
          return `<div class="alert-item"><span class="name">${d.emoji||'•'} ${esc(n)}</span><span class="val">+R$ ${fmt(d.spent - lim)}</span></div>`;
        }).join('')}
      </div>` : ''}

    <div class="sec-title">Consumo no cartão este mês</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      ${cardChips || '<span style="font-size:12px;color:#555">Nenhum gasto registrado</span>'}
    </div>

    ${chartData.length > 0 ? `
      <div class="chart-wrap">
        <canvas id="dash-chart" width="200" height="200"></canvas>
        <div class="chart-center">
          <div class="chart-center-label">Total</div>
          <div class="chart-center-val" data-kpi="totalSpent">R$ ${fmt(totalSpent)}</div>
        </div>
      </div>` : ''}

    ${catRows ? `<div class="sec-title">Por categoria</div>${catRows}` : ''}
  `;

  // Render chart
  if (chartData.length > 0) {
    if (chartInst) { chartInst.destroy(); chartInst = null; }
    const ctx = document.getElementById('dash-chart');
    if (ctx) {
      chartInst = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: chartLabels, datasets: [{ data: chartData, backgroundColor: chartColors, borderWidth: 2, borderColor: '#141414' }] },
        options: {
          cutout: '72%', plugins: { legend: { display: false }, tooltip: {
            callbacks: { label: ctx => ` ${ctx.label}: R$ ${fmt(ctx.raw)}` }
          }}
        }
      });
    }
  }
}

// === RENDER: CHAT ===
function renderChat() {
  const el = document.getElementById('chat-root');
  if (!groqKey) {
    el.innerHTML = `
      <div class="chat-key-setup">
        <p>Configure sua chave da Groq para usar o assistente financeiro.</p>
        <input class="input-key" type="password" id="groq-key-input" placeholder="gsk_..." />
        <button class="btn-primary" onclick="salvarChaveGroq()">Salvar e começar</button>
      </div>
      ${renderChatHTML()}`;
  } else {
    el.innerHTML = renderChatHTML();
  }
}

function renderChatHTML() {
  return `
    <div class="chat-wrap">
      <div class="chat-messages" id="chat-messages">${buildChatBubbles()}</div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chat-input" placeholder="Ex: gastei R$80 no mercado no Nubank..."
          onkeydown="onChatKey(event)" rows="1"></textarea>
        <button class="btn-send" id="btn-send" onclick="onChatSend()">➤</button>
      </div>
    </div>`;
}

function buildChatBubbles() {
  if (chatHistory.length === 0) {
    return `<div class="bubble-system">Olá! Pergunte sobre suas finanças ou diga "gastei R$X em Y no Nubank"</div>`;
  }
  let html = chatHistory.map(m => {
    if (m.role === 'user') return `<div class="chat-bubble bubble-user">${esc(m.content)}</div>`;
    if (m.role === 'assistant') return `<div class="chat-bubble bubble-ai">${esc(m.content)}</div>`;
    return '';
  }).join('');
  if (chatTyping) html += `<div class="chat-typing">✦ digitando...</div>`;
  return html;
}

function renderChatMessages(typing = false) {
  const msgs = document.getElementById('chat-messages');
  if (!msgs) { renderChat(); return; }
  msgs.innerHTML = buildChatBubbles();
  msgs.scrollTop = msgs.scrollHeight;
}

function salvarChaveGroq() {
  const k = document.getElementById('groq-key-input')?.value?.trim();
  if (!k || !k.startsWith('gsk_')) { showToast('Chave inválida — deve começar com gsk_', 'error'); return; }
  groqKey = k;
  localStorage.setItem('oiv2_groq_key', k);
  renderChat();
  showToast('Chave salva ✓', 'success');
}

function onChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onChatSend(); }
}

async function onChatSend() {
  const inp = document.getElementById('chat-input');
  const msg = inp?.value?.trim();
  if (!msg || chatTyping) return;
  inp.value = '';
  await sendChat(msg);
}

// === RENDER: CONTAS ===
function renderContas() {
  const el = document.getElementById('contas-root');
  const totalFaltante = commitments.reduce((s, c) => s + Math.max(Number(c.remaining), 0), 0);
  const totalPago     = commitments.reduce((s, c) => s + Number(c.paid), 0);
  const qtdQuitadas   = commitments.filter(c => Number(c.remaining) <= 0.005).length;

  // Income section
  const incHtml = incomeItems.map(inc => `
    <div class="income-row">
      <div>
        <div class="income-name">💰 ${esc(inc.name)}</div>
        ${inc.expected_day ? `<div style="font-size:11px;color:#555">Previsto: dia ${inc.expected_day}</div>` : ''}
      </div>
      <div class="income-right">
        <div class="income-val">R$ ${fmt(inc.is_received ? inc.actual_amount : inc.expected_amount)}</div>
        ${inc.is_received
          ? `<span class="badge-received">✓ Recebido</span>`
          : `<span class="badge-expected">Aguardando</span>`}
      </div>
    </div>`).join('');

  // Sort commitments by priority
  const sorted = [...commitments].sort((a, b) => prioridadeConta(a) - prioridadeConta(b) || (a.due_day||99) - (b.due_day||99));

  // Group by priority section
  let lastPrio = -1;
  const PRIO_LABEL = ['🔴 Vencidas', '🔴 Vencidas (parcial)', '🟡 Hoje', '⚡ Esta semana', '📅 Próximas', '✅ Pagas', '🔵 Faturas / Futuras'];
  const cmtHtml = sorted.map(c => {
    const p = prioridadeConta(c);
    let divider = '';
    if (p !== lastPrio) {
      lastPrio = p;
      divider = `<div class="secao-divider">${PRIO_LABEL[Math.min(p, PRIO_LABEL.length-1)]}</div>`;
    }
    return divider + buildContaCard(c);
  }).join('');

  el.innerHTML = `
    <div class="contas-header">
      <div>
        <div class="contas-header-label">A pagar este mês</div>
        <div class="contas-header-val">R$ ${fmt(totalFaltante)}</div>
      </div>
      <div style="text-align:right">
        <div class="contas-header-label">Quitadas</div>
        <div class="contas-header-sub">${qtdQuitadas} / ${commitments.length}</div>
      </div>
    </div>

    ${incomeItems.length > 0 ? `<div class="sec-title">Entradas previstas</div>${incHtml}` : ''}

    <div class="sec-title">Contas e faturas</div>
    ${cmtHtml || '<div class="empty-state"><div class="icon">✅</div>Nenhuma conta cadastrada</div>'}
  `;
}

function buildContaCard(c) {
  const venc  = c.due_day;
  const status = statusConta(c, venc);
  const paid  = Number(c.paid);
  const rem   = Number(c.remaining);
  const plan  = Number(c.planned_amount);
  const pct   = plan > 0 ? Math.min((paid / plan) * 100, 100) : 0;
  const barClass = pct >= 100 ? 'green' : pct >= 50 ? 'amber' : '';

  const badgeMap = {
    pago:    `<span class="badge badge-pago">✓ Pago</span>`,
    parcial: `<span class="badge badge-parcial">Parcial</span>`,
    vencido: `<span class="badge badge-vencido">Vencido</span>`,
    hoje:    `<span class="badge badge-hoje">Vence hoje</span>`,
    semana:  `<span class="badge badge-semana">Em breve</span>`,
    futuro:  `<span class="badge badge-futuro">Dia ${venc||'?'}</span>`,
    fatura:  `<span class="badge badge-fatura">💳 Fatura ${c.card_name || ''}</span>`
  };

  const isOverdue = status === 'vencido';
  const isToday   = status === 'hoje';

  return `
    <div class="conta-card ${isOverdue?'overdue':''} ${isToday?'today':''}" data-row="${esc(c.id)}">
      <div class="conta-top">
        <div>
          <div class="conta-name">${esc(c.name)}</div>
          <div class="conta-meta">${c.category_name ? esc(c.category_emoji||'') + ' ' + esc(c.category_name) : ''} ${c.type === 'parcelado' && c.installment_current ? `· ${c.installment_current}/${c.installment_total}` : ''}</div>
          ${badgeMap[status] || ''}
        </div>
        <div class="conta-right">
          <div class="conta-val">R$ ${fmt(plan)}</div>
          ${paid > 0 ? `<div class="conta-paid">Pago: R$ ${fmt(paid)}</div>` : ''}
          ${rem > 0.005 ? `<div class="conta-remaining">Falta: R$ ${fmt(rem)}</div>` : ''}
        </div>
      </div>
      ${pct > 0 ? `<div class="conta-prog"><div class="progress-bar"><div class="progress-fill ${barClass}" style="width:${pct}%"></div></div></div>` : ''}
      <div class="conta-actions">
        ${status !== 'pago' ? `
        <button class="btn-pay-open" onclick="abrirPayForm('${esc(c.id)}', ${rem > 0.005 ? fmt(rem).replace(/\./g,'').replace(',','.') : plan})">
          ${paid > 0 ? '+ Adicionar pagamento' : 'Registrar pagamento'}
        </button>` : ''}
        <button class="btn-edit-conta" onclick="abrirEditarCommitment('${esc(c.id)}')">✏️ Editar</button>
        <button class="btn-del-conta" onclick="deletarCommitment('${esc(c.id)}', '${esc(c.name)}')">🗑️</button>
      </div>
      ${status !== 'pago' ? `
        <div class="pay-form" id="pay-form-${esc(c.id)}">
          <div class="pay-row">
            <input class="pay-input" type="number" step="0.01" min="0"
              id="pay-val-${esc(c.id)}"
              value="${rem > 0.005 ? rem.toFixed(2) : plan.toFixed(2)}"
              oninput="atualizarPayTotal('${esc(c.id)}')"
              placeholder="Valor" />
            <button class="btn-pay" onclick="confirmarPagamento('${esc(c.id)}')">Confirmar</button>
          </div>
          <div class="pay-total-preview" id="pay-total-${esc(c.id)}">
            Total após: R$ ${fmt(paid + (rem > 0.005 ? rem : plan))}
          </div>
        </div>` : ''}
    </div>`;
}

function abrirPayForm(id, sugestao) {
  document.querySelectorAll('.pay-form.open').forEach(f => f.classList.remove('open'));
  const form = document.getElementById(`pay-form-${id}`);
  if (form) { form.classList.add('open'); document.getElementById(`pay-val-${id}`)?.focus(); }
}

function atualizarPayTotal(id) {
  const c    = commitments.find(x => x.id === id);
  const val  = parseFloat(document.getElementById(`pay-val-${id}`)?.value) || 0;
  const prev = document.getElementById(`pay-total-${id}`);
  if (prev && c) prev.textContent = `Total após: R$ ${fmt(Number(c.paid) + val)}`;
}

async function confirmarPagamento(id) {
  const c   = commitments.find(x => x.id === id);
  const inp = document.getElementById(`pay-val-${id}`);
  const val = parseFloat(inp?.value);
  if (!c || !val || val <= 0) { showToast('Informe um valor válido', 'error'); return; }

  // Optimistic
  const prevPaid = c.paid;
  c.paid      = Number(c.paid) + val;
  c.remaining = Number(c.planned_amount) - c.paid;
  renderContas();
  dirtyTabs.add('dashboard');

  try {
    await insertPayment(id, val, null, null);
    await loadMes();
    showToast(`Pagamento de R$ ${fmt(val)} registrado ✓`, 'success');
  } catch(e) {
    c.paid = prevPaid;
    c.remaining = Number(c.planned_amount) - prevPaid;
    renderContas();
    showToast('Erro ao registrar pagamento', 'error');
  }
}

// === EDITAR / DELETAR COMPROMISSO ===
function abrirEditarCommitment(id) {
  const c = commitments.find(x => x.id === id);
  if (!c) return;
  const modal = document.getElementById('edit-modal');
  document.getElementById('edit-modal-id').value    = id;
  document.getElementById('edit-modal-nome').value  = c.name;
  document.getElementById('edit-modal-valor').value = Number(c.planned_amount).toFixed(2);
  document.getElementById('edit-modal-dia').value   = c.due_day || '';
  document.getElementById('edit-modal-tipo').value  = c.type || 'pontual';
  modal.style.display = 'flex';
}

function fecharEditModal() {
  document.getElementById('edit-modal').style.display = 'none';
}

async function salvarEdicaoCommitment() {
  const id    = document.getElementById('edit-modal-id').value;
  const nome  = document.getElementById('edit-modal-nome').value.trim();
  const valor = parseFloat(document.getElementById('edit-modal-valor').value);
  const dia   = parseInt(document.getElementById('edit-modal-dia').value) || null;
  const tipo  = document.getElementById('edit-modal-tipo').value;
  if (!nome || !valor || valor <= 0) { showToast('Preencha nome e valor', 'error'); return; }

  const { error } = await sb.from('fin_commitments').update({ name: nome, planned_amount: valor, due_day: dia, type: tipo }).eq('id', id);
  if (error) { showToast('Erro ao salvar: ' + error.message, 'error'); return; }

  fecharEditModal();
  await loadMes();
  showToast('Compromisso atualizado ✓', 'success');
}

async function deletarCommitment(id, nome) {
  if (!confirm(`Deletar "${nome}"?`)) return;
  const { error } = await sb.from('fin_commitments').delete().eq('id', id);
  if (error) { showToast('Erro ao deletar: ' + error.message, 'error'); return; }
  await loadMes();
  showToast('Compromisso removido ✓', 'success');
}

// === RENDER: FATURAS ===
function renderFaturas() {
  const el = document.getElementById('faturas-root');
  const creditCards = paymentMethods.filter(p => p.type === 'credito' && p.active);

  if (creditCards.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="icon">💳</div>Nenhum cartão de crédito cadastrado<br><small style="margin-top:8px;display:block">Adicione cartões em ⚙️ Gestão</small></div>`;
    return;
  }

  const html = creditCards.map(card => {
    const cardEntries = spendingSummary.filter(s => s.card_id === card.id);
    const total = cardEntries.reduce((s, x) => s + Number(x.total_spent), 0);

    const catRows = cardEntries.sort((a,b) => Number(b.total_spent) - Number(a.total_spent)).map(s => `
      <div class="fatura-cat-row">
        <span class="fatura-cat-name">${s.category_emoji||'•'} ${esc(s.category_name)}</span>
        <span class="fatura-cat-val">R$ ${fmt(s.total_spent)}</span>
      </div>`).join('');

    const proxMes  = mesAtual === 12 ? 1 : mesAtual + 1;
    const proxAno  = mesAtual === 12 ? anoAtual + 1 : anoAtual;
    const vencLabel = card.billing_day ? `vence dia ${card.billing_day} de ${MESES[proxMes-1]}` : `em ${MESES[proxMes-1]}`;

    // check if fatura already generated
    const faturaExiste = commitments.some(c =>
      c.type === 'fatura' && c.fatura_card_id === card.id &&
      c.month === proxMes && c.year === proxAno
    );

    return `
      <div class="fatura-card">
        <div class="fatura-header">
          <div class="fatura-card-name">
            <span class="fatura-dot" style="background:${esc(card.color||'#555')}"></span>
            ${esc(card.name)}
          </div>
          <div class="fatura-total">R$ ${fmt(total)}</div>
        </div>
        <div class="fatura-sub">Consumo de ${mesLabel(mesAtual, anoAtual)} · ${vencLabel}</div>
        ${catRows ? `<div class="fatura-cats">${catRows}</div>` : '<div style="font-size:12px;color:#444;margin-top:8px">Sem gastos registrados</div>'}
        ${total > 0 && !faturaExiste
          ? `<button class="btn-gen-fatura" onclick="gerarFatura('${esc(card.id)}', ${total}, ${proxMes}, ${proxAno})">
              + Gerar fatura de ${MESES[proxMes-1]} (R$ ${fmt(total)})
             </button>`
          : faturaExiste
            ? `<div style="font-size:11px;color:#555;text-align:center;margin-top:8px">✓ Fatura de ${MESES[proxMes-1]} já gerada</div>`
            : ''}
      </div>`;
  }).join('');

  el.innerHTML = html || '<div class="empty-state">Nenhum dado</div>';
}

async function gerarFatura(cardId, total, proxMes, proxAno) {
  const card = paymentMethods.find(p => p.id === cardId);
  try {
    await insertCommitment({
      month: proxMes, year: proxAno,
      name: `Fatura ${card?.name || 'Cartão'}`,
      type: 'fatura',
      planned_amount: total,
      due_day: card?.billing_day || null,
      fatura_card_id: cardId,
      fatura_reference_month: mesAtual,
      fatura_reference_year: anoAtual
    });
    showToast(`Fatura de ${MESES[proxMes-1]} gerada ✓`, 'success');
    await loadMes();
  } catch(e) {
    showToast('Erro ao gerar fatura', 'error');
  }
}

// === RENDER: GASTOS ===
function renderGastos() {
  const el = document.getElementById('gastos-root');

  const catOptions = categories.map(c =>
    `<option value="${esc(c.id)}">${esc(c.emoji||'')} ${esc(c.name)}</option>`
  ).join('');

  const pmOptions = paymentMethods.filter(p => p.active).map(p =>
    `<option value="${esc(p.id)}">${esc(p.name)}</option>`
  ).join('');

  const totalGasto = spendingEntries.reduce((s, e) => s + Number(e.amount), 0);

  // breakdown por categoria
  const catMap = {};
  spendingEntries.forEach(e => {
    const cat = categories.find(c => c.id === e.category_id);
    const key = cat ? cat.id : 'sem';
    if (!catMap[key]) catMap[key] = { name: cat ? (cat.emoji||'')+ ' ' + cat.name : 'Sem categoria', total: 0 };
    catMap[key].total += Number(e.amount);
  });
  const catEntries = Object.values(catMap).sort((a,b) => b.total - a.total);
  const maxCat = catEntries.length ? catEntries[0].total : 1;

  const breakdownHtml = catEntries.length ? `
    <div class="perfil-section-title" style="margin-bottom:10px">Por categoria</div>
    <div class="gastos-cat-breakdown">
      ${catEntries.map(c => `
        <div class="gastos-cat-row">
          <div class="gastos-cat-label">${esc(c.name)}</div>
          <div class="gastos-cat-bar-wrap"><div class="gastos-cat-bar" style="width:${Math.round(c.total/maxCat*100)}%"></div></div>
          <div class="gastos-cat-val">R$${fmt(c.total)}</div>
        </div>`).join('')}
    </div>` : '';

  // agrupar entradas por dia
  const byDay = {};
  spendingEntries.forEach(e => {
    const d = e.spend_date ? e.spend_date.slice(0,10) : 'sem-data';
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(e);
  });
  const days = Object.keys(byDay).sort((a,b) => b.localeCompare(a));

  const listaHtml = days.length ? days.map(d => {
    const label = d === 'sem-data' ? 'Sem data' : new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short' });
    const items = byDay[d].map(e => {

    return `<div class="gastos-group-day"><div class="gastos-day-label">${label}</div>${items}</div>`;

  el.innerHTML = `

async function addGasto() {
  const valor = parseFloat(document.getElementById('g-valor')?.value);
  const catId = document.getElementById('g-cat')?.value;
  const pmId  = document.getElementById('g-pm')?.value;
  const data  = document.getElementById('g-data')?.value;
  const desc  = document.getElementById('g-desc')?.value?.trim();

  if (!valor || valor <= 0) { showToast('Informe um valor válido', 'error'); return;  }
  if (!catId)                { showToast('Selecione uma categoria', 'error'); return; }
  if (!pmId)                 { showToast('Selecione o método de pagamento', 'error'); return; }

  const d = data || new Date().toISOString().slice(0,10);
  const m = parseInt(d.slice(5,7));
  const y = parseInt(d.slice(0,4));

  const { data: row, error } = await sb.from('fin_spending_entries').insert({
    month: m, year: y,
    category_id: catId,
    payment_method_id: pmId,
    amount: valor,
    description: desc || null,
    spend_date: d
  }).select().single();

  if (error) { showToast('Erro ao registrar: ' + error.message, 'error'); return; }

  spendingEntries.unshift(row);
  dirtyTabs.add('dashboard');
  dirtyTabs.add('faturas');
  renderGastos();
  showToast('Gasto registrado ✓', 'success');
}

async function deletarGasto(id) {
  if (!confirm('Remover este lançamento?')) return;
  const { error } = await sb.from('fin_spending_entries').delete().eq('id', id);
  if (error) { showToast('Erro ao remover', 'error'); return; }
  spendingEntries = spendingEntries.filter(e => e.id !== id);
  dirtyTabs.add('dashboard');
  dirtyTabs.add('faturas');
  renderGastos();
  showToast('Lançamento removido', 'success');
}

  const el = document.getElementById('perfil-root');

  const p = carregarPerfil();
  const rendasHtml = (p.rendas||[]).map((r, i) => `
    <div class="perfil-renda-item">
      <div class="perfil-renda-info">
        <div class="perfil-renda-nome">${esc(r.nome)}</div>
        <div class="perfil-renda-meta">Dia ${r.dia} de cada mês</div>
      </div>
      <div class="perfil-renda-val">R$${fmt(r.valor)}</div>
      <button class="btn-del" onclick="removerRenda(${i})">🗑</button>
    </div>`).join('');

  el.innerHTML = `

      <div class="perfil-avatar">👤</div>
    </div>

      <div class="field">

      <p style="font-size:12px;color:#555;margin-bottom:12px">Esses valores serão lançados automaticamente como "entradas previstas" ao mudar o mês.</p>
      ${rendasHtml}

    </div>

    <button class="btn-salvar-perfil" onclick="salvarPerfil()">Salvar perfil</button>

function carregarPerfil() {
  try { return JSON.parse(localStorage.getItem('oiv2_perfil') || '{}'); } catch { return {}; }
}

function salvarPerfil() {
  const p = carregarPerfil();
  p.nome = document.getElementById('p-nome')?.value?.trim() || p.nome || '';
  localStorage.setItem('oiv2_perfil', JSON.stringify(p));

  // sincronizar rendimentos com fin_income_items do mês atual
  sincronizarRendas(p.rendas || []);
  showToast('Perfil salvo ✓', 'success');
  renderPerfil();
}

async function sincronizarRendas(rendas) {
  if (!rendas.length) return;
  for (const r of rendas) {
    const { data: existe } = await sb.from('fin_income_items')
      .select('id').eq('month', mesAtual).eq('year', anoAtual).eq('name', r.nome).maybeSingle();
    if (!existe) {
      await sb.from('fin_income_items').insert({
        month: mesAtual, year: anoAtual,
        name: r.nome, expected_amount: r.valor, expected_day: r.dia, is_received: false
      });
    }
  }
  // recarregar incomeItems
  const { data } = await sb.from('fin_income_items').select('*').eq('month', mesAtual).eq('year', anoAtual).order('expected_day');
  incomeItems = data || [];
  dirtyTabs.add('dashboard');
  dirtyTabs.add('contas');
}

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">➕ Nova renda</div>
    <div class="field"><label>Nome</label><input type="text" id="ar-nome" placeholder="Ex: Salário, Freelance..." /></div>
    <div class="field-row">
      <div class="field"><label>Valor líquido (R$)</label><input type="number" id="ar-valor" placeholder="0,00" min="0" step="0.01" /></div>
      <div class="field"><label>Dia previsto</label><input type="number" id="ar-dia" placeholder="5" min="1" max="31" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal(null)">Cancelar</button>
      <button class="btn-save" onclick="confirmarAddRenda()">Adicionar</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function confirmarAddRenda() {
  const nome  = document.getElementById('ar-nome')?.value?.trim();
  const valor = parseFloat(document.getElementById('ar-valor')?.value);
  const dia   = parseInt(document.getElementById('ar-dia')?.value) || 1;
  if (!nome || !valor) { showToast('Preencha nome e valor', 'error'); return; }

  const p = carregarPerfil();
  p.rendas = p.rendas || [];
  p.rendas.push({ nome, valor, dia });
  localStorage.setItem('oiv2_perfil', JSON.stringify(p));
  fecharModal(null);
  renderPerfil();
  showToast('Renda adicionada ✓', 'success');
}

function removerRenda(idx) {
  const p = carregarPerfil();
  p.rendas = p.rendas || [];
  p.rendas.splice(idx, 1);
  localStorage.setItem('oiv2_perfil', JSON.stringify(p));
  renderPerfil();
}

async function salvarCommitment() {
  const nome  = document.getElementById('cmt-nome').value.trim();
  const catId = document.getElementById('cmt-cat').value || null;
  const tipo  = document.getElementById('cmt-tipo').value;
  const valor = parseFloat(document.getElementById('cmt-valor').value);
  const dia   = parseInt(document.getElementById('cmt-dia').value) || null;
  if (!nome || !valor) { showToast('Preencha nome e valor', 'error'); return; }
  const payload = {
    month: mesAtual, year: anoAtual,
    name: nome, category_id: catId, type: tipo,
    planned_amount: valor, due_day: dia
  };
  if (tipo === 'parcelado') {
    payload.installment_current = parseInt(document.getElementById('cmt-parc-atual').value) || 1;
    payload.installment_total   = parseInt(document.getElementById('cmt-parc-total').value) || null;
    payload.total_debt          = parseFloat(document.getElementById('cmt-total-div').value) || null;
  }
  try {
    await insertCommitment(payload);
    showToast('Conta salva ✓', 'success');
    await loadMes();
    abrirGestao();
  } catch(e) { showToast('Erro ao salvar', 'error'); }
}

async function copiarMesAnterior() {
  const prevMes = mesAtual === 1 ? 12 : mesAtual - 1;
  const prevAno = mesAtual === 1 ? anoAtual - 1 : anoAtual;

  const { data: prev } = await sb.from('fin_commitments')
    .select('*').eq('month', prevMes).eq('year', prevAno)
    .in('type', ['fixo', 'parcelado']);

  if (!prev || prev.length === 0) { showToast('Nenhuma conta recorrente no mês anterior', ''); return; }

  const toInsert = prev.map(c => {
    const p = { ...c };
    delete p.id; delete p.created_at;
    p.month = mesAtual; p.year = anoAtual;
    if (p.type === 'parcelado' && p.installment_current && p.installment_total) {
      if (p.installment_current >= p.installment_total) return null; // quitado
      p.installment_current += 1;
    }
    return p;
  }).filter(Boolean);

  if (toInsert.length === 0) { showToast('Nenhuma parcela restante para copiar', ''); return; }

  try {
    await sb.from('fin_commitments').insert(toInsert);
    showToast(`${toInsert.length} contas copiadas ✓`, 'success');
    await loadMes();
    abrirGestao();
  } catch(e) { showToast('Erro ao copiar: ' + e.message, 'error'); }
}

// === EVENTS ===
function switchTab(tab) {
  abaAtiva = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(p => p.classList.toggle('active', p.id === 'tab-' + tab));

  if (dirtyTabs.has(tab)) {
    dirtyTabs.delete(tab);
    renderAtivo();
  }
}

function renderAtivo() {
  if (abaAtiva === 'dashboard') renderDashboard();
  if (abaAtiva === 'chat')      renderChat();
  if (abaAtiva === 'contas')    renderContas();
  if (abaAtiva === 'faturas')   renderFaturas();
  if (abaAtiva === 'gastos')    renderGastos();
  if (abaAtiva === 'perfil')    renderPerfil();
}

function navMes(delta) {
  mesAtual += delta;
  if (mesAtual > 12) { mesAtual = 1;  anoAtual++; }
  if (mesAtual < 1)  { mesAtual = 12; anoAtual--; }
  loadMes();
}

async function recarregar() { await loadMes(); showToast('Dados atualizados ✓', 'success'); }

async function retentarUltimaAcao() {
  if (!ultimaAcaoParams) return;
  document.getElementById('toast-retry').style.display = 'none';
  const p = ultimaAcaoParams;
  ultimaAcaoParams = null;
  try { await p.fn(); } catch(e) { showToast('Falhou novamente: ' + e.message, 'error'); }
}

<!-- Modal editar compromisso -->
<div id="edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
  <div style="background:var(--card-bg);border-radius:16px;padding:24px;width:min(90vw,400px);display:flex;flex-direction:column;gap:14px">
    <h3 style="margin:0;font-size:16px;font-weight:700">Editar compromisso</h3>
    <input type="hidden" id="edit-modal-id" />
    <div>
      <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px">Nome</label>
      <input id="edit-modal-nome" type="text" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);box-sizing:border-box" />
    </div>
    <div>
      <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px">Valor planejado (R$)</label>
      <input id="edit-modal-valor" type="number" step="0.01" min="0" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);box-sizing:border-box" />
    </div>
    <div style="display:flex;gap:12px">
      <div style="flex:1">
        <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px">Dia vencimento</label>
        <input id="edit-modal-dia" type="number" min="1" max="31" placeholder="—" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);box-sizing:border-box" />
      </div>
      <div style="flex:1">
        <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px">Tipo</label>
        <select id="edit-modal-tipo" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);box-sizing:border-box">
          <option value="fixo">Fixo</option>
          <option value="pontual">Pontual</option>
          <option value="parcelado">Parcelado</option>
          <option value="fatura">Fatura</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button onclick="fecharEditModal()" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:14px">Cancelar</button>
      <button onclick="salvarEdicaoCommitment()" style="flex:2;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:14px;font-weight:600">Salvar</button>
    </div>
  </div>
</div>
</body>
</html>
